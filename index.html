<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #4a90e2; 
            --text: #dcdcdc;
            --border: #333;
            --label: #777;
            --esq-gold: #f1c40f;
            --sq80-fixed: #3498db;
            --sq80-prob: #1abc9c;
            --sq80-poss: #16a085;
            --hidden-wave: #00d2ff;
            --glass: rgba(255, 255, 255, 0.03);
            --tooltip-bg: #2c3e50;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px;
        }

        #drop-zone {
            width: 100%; height: 60px; border: 2px dashed #444; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #1e1e1e; cursor: pointer; color: var(--accent); margin-bottom: 15px;
        }

        .file-info-bar {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            font-size: 13px; padding: 12px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 6px;
        }

        .label-blue { color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        .type-icon { padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 10px; color: white; }
        .icon-bank { background: #27ae60; }
        .icon-single { background: #8e44ad; }

        .bank-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
        .bank-block { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .bank-header { font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 12px; font-size: 11px; letter-spacing: 1px; }
        .patch-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .patch-item { font-size: 11px; padding: 8px 4px; background: #252525; text-align: center; cursor: pointer; border: 1px solid #333; border-radius: 4px; }
        .patch-item.selected { background: var(--accent); color: #fff; border-color: #fff; }

        .status-area { 
            margin-bottom: 30px; padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent);
            background: linear-gradient(to right, #1a1a1a, #121212);
        }

        .synth-type-badge {
            display: inline-block; margin-left: 15px; padding: 4px 12px; border-radius: 4px;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
        }
        .badge-esq { background: rgba(241, 196, 15, 0.1); color: var(--esq-gold); border: 1px solid var(--esq-gold); }
        .badge-sq80 { background: rgba(52, 152, 219, 0.1); color: var(--sq80-fixed); border: 1px solid var(--sq80-fixed); }
        .badge-sq80-prob { background: rgba(26, 188, 156, 0.1); color: var(--sq80-prob); border: 1px solid var(--sq80-prob); }
        .badge-sq80-poss { background: rgba(22, 160, 133, 0.1); color: var(--sq80-poss); border: 1px solid var(--sq80-poss); }
        .badge-hidden { background: rgba(0, 210, 255, 0.1); color: var(--hidden-wave); border: 1px solid var(--hidden-wave); }

        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; }
        .module { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; position: relative; }
        .span-4 { grid-column: span 4; }
        .span-3 { grid-column: span 3; }
        .module-header { background: var(--glass); font-size: 10px; font-weight: 800; color: var(--accent); padding: 8px 12px; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; }

        .param-grid-row { display: flex; border-bottom: 1px solid var(--border); }
        .param-grid-row:last-child { border-bottom: none; }
        .cell { flex: 1; padding: 8px 4px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; cursor: help; }
        .cell:last-child { border-right: none; }
        
        .label { font-size: 9px; color: var(--label); text-transform: uppercase; margin-bottom: 2px; }
        .num { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
        
        .mod-container { display: flex; align-items: center; justify-content: center; }
        .mod-src { color: #aaa; font-size: 11px; font-weight: 600; }
        .mod-star { color: var(--label); font-size: 20px; font-weight: bold; padding: 0 12px; display: inline-block; transform: translateY(20%); user-select: none; }
        .mod-val { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; }

        .wave-num { font-size: 9px; color: var(--accent); opacity: 0.8; font-weight: bold; }
        .wave-name { color: #fff; font-size: 11px; font-weight: bold; }

        /* Tooltip Logic */
        .cell::after {
            content: attr(data-tooltip);
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-10px);
            width: 220px; padding: 12px; border-radius: 6px;
            background: var(--tooltip-bg); color: #fff; font-size: 11px; line-height: 1.4;
            text-align: left; visibility: hidden; opacity: 0; z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); pointer-events: none;
            white-space: pre-wrap; transition: opacity 0.2s; border: 1px solid rgba(255,255,255,0.1);
        }
        .cell:hover { z-index: 1001; }
        .cell:hover::after { visibility: visible; opacity: 1; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="drop-zone">Drop ESQ/SQ-80 SysEx Files Here</div>
    <input type="file" id="file-input" style="display: none;">

    <div id="file-info-bar" class="file-info-bar hidden">
        <span class="label-blue">FILE NAME: </span>
        <span id="filename-display" style="color: #eee; margin-right: 10px;"></span>
        <span id="file-type-icon" class="type-icon"></span>
    </div>

    <div id="bank-container" class="bank-container hidden">
        <div class="bank-block"><div class="bank-header">INT 1</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="status-area" class="status-area hidden">
        <span class="label-blue" style="font-size: 13px;">PATCH NAME:</span>
        <span id="patch-name-display" style="color: var(--esq-gold); font-size: 1.4rem; font-weight: 700; margin-left:10px;">---</span>
        <span id="synth-type-icon"></span>
    </div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        const WAVES = ["SAW", "BELL", "SINE", "SQUARE", "PULSE", "NOISE 1", "NOISE 2", "NOISE 3", "BASS", "PIANO", "EL PNO", "VOICE 1", "VOICE 2", "KICK", "REED", "ORGAN", "SYNTH 1", "SYNTH 2", "SYNTH 3", "FORMT 1", "FORMT 2", "FORMT 3", "FORMT 4", "FORMT 5", "PULSE2", "SQR 2", "4 OCTS", "PRIME", "BASS 2", "E PNO2", "OCTAVE", "OCT+5", "SAW 2", "TRIANG", "REED 2", "REED 3", "GRIT 1", "GRIT 2", "GRIT 3", "GLINT 1", "GLINT 2", "GLINT 3", "CLAV", "BRASS", "STRING", "DIGIT 1", "DIGIT 2", "BELL 2", "ALIEN", "BREATH", "VOICE 3", "STEAM", "METAL", "CHIME", "BOWING", "PICK 1", "PICK 2", "MALLET", "SLAP", "PLINK", "PLUCK", "PLUNK", "CLICK", "CHIFF", "THUMP", "LOGDRM", "KICK 2", "SNARE", "TOMTOM", "HI HAT", "DRUMS 1", "DRUMS 2", "DRUMS 3", "DRUMS 4", "DRUMS 5"];
        for(let i=75; i<=255; i++) { WAVES.push("WAV" + (i+1).toString().padStart(3, '0')); }

        const LFO_HINTS = {
            freq: "LFO FREQ. -- Determines the speed of the LFO. Range: 0 To 63.",
            reset: "RESET -- Returns to start of cycle each key strike when ON.",
            human: "HUMAN -- Adds random element to LFO Frequency when ON.",
            wav: "WAV -- Selects Waveform: TRI, SAW, SQR, or NOISE.",
            l1: "LEVEL 1 -- Level at which the LFO starts.",
            delay: "DELAY -- Rate of change from L1 to L2.",
            l2: "LEVEL 2 -- Level reached after Ramp sustain.",
            mod: "MOD -- Modulation Source for LFO depth."
        };

        const toSigned = (val) => (val & 0x80) ? -(val ^ 0xFF) - 1 : Math.floor(val/2);

        const renderMod = (label, srcIdx, val, hint) => `
            <div class="cell" data-tooltip="${hint}">
                <span class="label">${label}</span>
                <div class="mod-container">
                    <span class="mod-src">${MODS[srcIdx]}</span>
                    <span class="mod-star">*</span>
                    <span class="mod-val">${toSigned(val)}</span>
                </div>
            </div>`;

        let patches = [];
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

        function handleFile(file) {
            if (!file) return;
            document.getElementById('filename-display').innerText = file.name.toUpperCase();
            document.getElementById('file-info-bar').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        }

        function process(data) {
            let unpacked = [];
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }
            patches = [];
            const pcbSize = 102;
            const total = Math.floor(unpacked.length / pcbSize);

            document.getElementById('bank-container').classList.toggle('hidden', total <= 1);
            const typeIcon = document.getElementById('file-type-icon');
            typeIcon.innerText = total > 1 ? "BANK" : "SINGLE PATCH";
            typeIcon.className = total > 1 ? "type-icon icon-bank" : "type-icon icon-single";

            for (let i = 0; i < total; i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                let name = "";
                for(let n=0; n<6; n++) { name += String.fromCharCode(pcb[n] & 0x7F); }
                patches.push({ name: name.trim(), pcb: pcb });
            }
            renderBanks();
            if (patches.length > 0) displayParameters(patches[0]);
        }

        function renderBanks() {
            for (let b = 0; b < 4; b++) {
                const list = document.getElementById(`bank-${b}`);
                list.innerHTML = '';
                for (let p = 0; p < 10; p++) {
                    const idx = (b * 10) + p;
                    if (!patches[idx]) break;
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = patches[idx].name;
                    div.onclick = () => {
                        document.querySelectorAll('.patch-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        displayParameters(patches[idx]);
                    };
                    list.appendChild(div);
                }
            }
        }

        function displayParameters(patch) {
            document.getElementById('status-area').classList.remove('hidden');
            document.getElementById('patch-name-display').innerText = patch.name;
            const pcb = patch.pcb;
            const db = document.getElementById('dashboard');
            db.innerHTML = '';

            // Patch Detection Logic
            let hasHidden = (pcb[63] >= 74 || pcb[73] >= 74 || pcb[83] >= 74);
            let lvl1 = false, lvl2 = false, lvl3 = false;
            for(let e=0; e<4; e++) {
                let base = 6 + (e * 10);
                if (pcb[base+9] & 0x80) lvl1 = true;
                if (pcb[base+2] & 0x80) lvl2 = true;
            }
            if (pcb[63] > 31 || pcb[73] > 31 || pcb[83] > 31) lvl3 = true;
            const badge = document.getElementById('synth-type-icon');
            if (hasHidden) { badge.innerText = "HIDDEN WAVE"; badge.className = "synth-type-badge badge-hidden"; }
            else if (lvl1 && lvl2 && lvl3) { badge.innerText = "SQ-80"; badge.className = "synth-type-badge badge-sq80"; }
            else if (lvl1 || lvl2) { badge.innerText = "PROBABLE SQ-80"; badge.className = "synth-type-badge badge-sq80-prob"; }
            else { badge.innerText = "ESQ-1"; badge.className = "synth-type-badge badge-esq"; }

            // ROW 1: OSCILLATORS
            for(let i=1; i<=3; i++) {
                let base = 58 + (i-1)*10;
                let semi = pcb[base] & 0x7F;
                let wIdx = pcb[base+5];
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">OSCILLATOR ${i}</div>
                        <div class="param-grid-row">
                            <div class="cell"><span class="label">OCT</span><span class="num">${Math.floor(semi/12)-3}</span></div>
                            <div class="cell"><span class="label">SEMI</span><span class="num">${semi%12}</span></div>
                            <div class="cell"><span class="label">FINE</span><span class="num">${pcb[base+1]}</span></div>
                            <div class="cell"><span class="label">WAVE</span><span class="wave-num">W ${wIdx+1}</span><span class="wave-name">${WAVES[wIdx] || "---"}</span></div>
                        </div>
                        <div class="param-grid-row">
                            ${renderMod('MOD 1', pcb[base+2]&0x0F, pcb[base+3], "")}
                            ${renderMod('MOD 2', pcb[base+2]>>4, pcb[base+4], "")}
                        </div>
                    </div>`;
            }

            // ROW 2: DCAs
            for(let i=1; i<=3; i++) {
                let base = 64 + (i-1)*10;
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">DCA AMPLIFIER ${i}</div>
                        <div class="param-grid-row">
                            <div class="cell"><span class="label">LEVEL</span><span class="num">${pcb[base]}</span></div>
                            <div class="cell"><span class="label">OUTPUT</span><span class="num">${(pcb[base+5]&0x01)?"ON":"OFF"}</span></div>
                        </div>
                        <div class="param-grid-row">
                            ${renderMod('MOD 1', pcb[base+1]&0x0F, pcb[base+2], "")}
                            ${renderMod('MOD 2', pcb[base+1]>>4, pcb[base+3], "")}
                        </div>
                    </div>`;
            }

            // ROW 3: LFOs
            for(let i=1; i<=3; i++) {
                let base = 36 + (i-1)*6; 
                let wIdx = (pcb[base+1]>>2)&0x03;
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">LFO ${i}</div>
                        <div class="param-grid-row">
                            <div class="cell" data-tooltip="${LFO_HINTS.freq}"><span class="label">FREQ</span><span class="num">${pcb[base]}</span></div>
                            <div class="cell" data-tooltip="${LFO_HINTS.reset}"><span class="label">RESET</span><span class="num">${(pcb[base+1]&0x01)?"ON":"OFF"}</span></div>
                            <div class="cell" data-tooltip="${LFO_HINTS.human}"><span class="label">HUMAN</span><span class="num">${(pcb[base+1]&0x02)?"ON":"OFF"}</span></div>
                            <div class="cell" data-tooltip="${LFO_HINTS.wav}"><span class="label">WAV</span><span class="wave-name">${["TRI","SAW","SQR","NOISE"][wIdx]}</span></div>
                        </div>
                        <div class="param-grid-row">
                            <div class="cell" data-tooltip="${LFO_HINTS.l1}"><span class="label">LEVEL 1</span><span class="num">${pcb[base+5]}</span></div>
                            <div class="cell" data-tooltip="${LFO_HINTS.delay}"><span class="label">DELAY</span><span class="num">${pcb[base+2]}</span></div>
                            <div class="cell" data-tooltip="${LFO_HINTS.l2}"><span class="label">LEVEL 2</span><span class="num">${pcb[base+5]}</span></div>
                            ${renderMod('MOD', pcb[base+3]&0x0F, pcb[base+4], LFO_HINTS.mod)}
                        </div>
                    </div>`;
            }

            // ROW 4: ENVELOPES
            for(let i=1; i<=4; i++) {
                let base = 6 + (i-1)*10;
                db.innerHTML += `
                    <div class="module span-3">
                        <div class="module-header">ENVELOPE ${i}</div>
                        <div class="param-grid-row">
                            <div class="cell" data-tooltip="T1: Attack Time"><span class="label">T1</span><span class="num">${pcb[base+4]}</span></div>
                            <div class="cell" data-tooltip="T2: Decay 1 Time"><span class="label">T2</span><span class="num">${pcb[base+5]}</span></div>
                            <div class="cell" data-tooltip="T3: Decay 2 Time"><span class="label">T3</span><span class="num">${pcb[base+6]}</span></div>
                            <div class="cell" data-tooltip="T4: Release Time"><span class="label">T4</span><span class="num">${pcb[base+7]}</span></div>
                        </div>
                        <div class="param-grid-row">
                            <div class="cell" data-tooltip="L1: Attack Level"><span class="label">L1</span><span class="num">${toSigned(pcb[base])}</span></div>
                            <div class="cell" data-tooltip="L2: Decay 1 Level"><span class="label">L2</span><span class="num">${toSigned(pcb[base+1])}</span></div>
                            <div class="cell" data-tooltip="L3: Decay 2 Level (Sustain)"><span class="label">L3</span><span class="num">${toSigned(pcb[base+2])}</span></div>
                            <div class="cell" data-tooltip="L4: Final Level"><span class="label">L4</span><span class="num">0</span></div>
                        </div>
                        <div class="param-grid-row">
                             <div class="cell" data-tooltip="Keyboard Scaling"><span class="label">KBD</span><span class="num">${pcb[base+3]}</span></div>
                             <div class="cell" data-tooltip="Velocity Scaling"><span class="label">VEL</span><span class="num">${pcb[base+8]}</span></div>
                        </div>
                    </div>`;
            }

            // ROW 5: FILTER / MODES / SPLIT / DCA4
            // Filter Block
            db.innerHTML += `
                <div class="module span-4">
                    <div class="module-header">FILTER</div>
                    <div class="param-grid-row">
                        <div class="cell"><span class="label">FREQ</span><span class="num">${pcb[88]}</span></div>
                        <div class="cell"><span class="label">RES (Q)</span><span class="num">${pcb[89]}</span></div>
                        <div class="cell"><span class="label">KEYBOARD</span><span class="num">${pcb[90]}</span></div>
                    </div>
                    <div class="param-grid-row">
                        ${renderMod('MOD 1', pcb[91]&0x0F, pcb[92], "")}
                        ${renderMod('MOD 2', pcb[91]>>4, pcb[94], "")}
                    </div>
                </div>`;

            // Modes Block
            const modeByte = pcb[100];
            db.innerHTML += `
                <div class="module span-4">
                    <div class="module-header">MODES</div>
                    <div class="param-grid-row">
                        <div class="cell"><span class="label">SYNC</span><span class="num">${(modeByte & 0x01) ? "ON" : "OFF"}</span></div>
                        <div class="cell"><span class="label">AM</span><span class="num">${(modeByte & 0x02) ? "ON" : "OFF"}</span></div>
                        <div class="cell"><span class="label">MONO</span><span class="num">${(modeByte & 0x04) ? "ON" : "OFF"}</span></div>
                        <div class="cell"><span class="label">GLIDE</span><span class="num">${pcb[101]}</span></div>
                    </div>
                    <div class="param-grid-row">
                        <div class="cell"><span class="label">VC02 FIX</span><span class="num">${(modeByte & 0x08) ? "ON" : "OFF"}</span></div>
                        <div class="cell"><span class="label">ENV RE-TRIG</span><span class="num">${(modeByte & 0x10) ? "ON" : "OFF"}</span></div>
                    </div>
                </div>`;

            // DCA 4 / Pan Block
            db.innerHTML += `
                <div class="module span-4">
                    <div class="module-header">DCA 4 & PAN</div>
                    <div class="param-grid-row">
                        <div class="cell"><span class="label">FINAL VOL</span><span class="num">${pcb[95]}</span></div>
                        <div class="cell"><span class="label">PAN</span><span class="num">${pcb[98]}</span></div>
                    </div>
                    <div class="param-grid-row">
                        ${renderMod('VOL MOD', pcb[96]&0x0F, pcb[97], "")}
                        <div class="cell"><span class="label">PAN MOD</span><span class="mod-src">${MODS[pcb[99] & 0x0F]}</span></div>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
