<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #4a90e2; 
            --text: #dcdcdc;
            --border: #333;
            --label: #777;
            --esq-gold: #f1c40f;
            
            /* Stepped Blue-Teal Palette */
            --sq80-fixed: #3498db;   /* Level 1+2+3: Solid Blue */
            --sq80-prob: #1abc9c;    /* Level 1/2: Teal */
            --sq80-poss: #16a085;    /* Level 3: Deep Teal */
            
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        #drop-zone {
            width: 100%; height: 60px; border: 2px dashed #444; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #1e1e1e; cursor: pointer; color: var(--accent); margin-bottom: 15px;
        }

        .file-info-bar {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            font-size: 13px; padding: 12px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 6px;
        }

        .label-blue { color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        .type-icon { padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 10px; color: white; }
        .icon-bank { background: #27ae60; }
        .icon-single { background: #8e44ad; }

        .bank-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
        .bank-block { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .bank-header { font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 12px; font-size: 11px; letter-spacing: 1px; }
        .patch-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .patch-item { font-size: 11px; padding: 8px 4px; background: #252525; text-align: center; cursor: pointer; border: 1px solid #333; border-radius: 4px; }
        .patch-item.selected { background: var(--accent); color: #fff; border-color: #fff; }

        .status-area { 
            margin-bottom: 30px; padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent);
            background: linear-gradient(to right, #1a1a1a, #121212);
        }

        /* Detection Badges */
        .synth-type-badge {
            display: inline-block; margin-left: 15px; padding: 4px 12px; border-radius: 4px;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
        }
        .badge-esq { background: rgba(241, 196, 15, 0.1); color: var(--esq-gold); border: 1px solid var(--esq-gold); }
        .badge-sq80 { background: rgba(52, 152, 219, 0.1); color: var(--sq80-fixed); border: 1px solid var(--sq80-fixed); }
        .badge-sq80-prob { background: rgba(26, 188, 156, 0.1); color: var(--sq80-prob); border: 1px solid var(--sq80-prob); }
        .badge-sq80-poss { background: rgba(22, 160, 133, 0.1); color: var(--sq80-poss); border: 1px solid var(--sq80-poss); }

        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; }
        .module { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .span-4 { grid-column: span 4; }
        .span-3 { grid-column: span 3; }
        .module-header { background: var(--glass); font-size: 10px; font-weight: 800; color: var(--accent); padding: 8px 12px; border-bottom: 1px solid var(--border); }

        .param-grid-row { display: flex; border-bottom: 1px solid var(--border); }
        .cell { flex: 1; padding: 10px 4px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .cell:last-child { border-right: none; }
        
        .label { font-size: 9px; color: var(--label); text-transform: uppercase; margin-bottom: 4px; }
        .num { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
        .wave-num { font-size: 9px; color: var(--accent); opacity: 0.8; margin-bottom: 1px; font-weight: bold; }
        .wave-name { color: #fff; font-size: 11px; font-weight: bold; }
        .src { color: #aaa; font-size: 10px; font-weight: bold; margin-bottom: 2px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="drop-zone">Drop ESQ/SQ-80 SysEx Files Here</div>
    <input type="file" id="file-input" style="display: none;">

    <div id="file-info-bar" class="file-info-bar hidden">
        <span class="label-blue">FILE NAME: </span>
        <span id="filename-display" style="color: #eee; margin-right: 10px;"></span>
        <span id="file-type-icon" class="type-icon"></span>
    </div>

    <div id="bank-container" class="bank-container hidden">
        <div class="bank-block"><div class="bank-header">INT 1</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="status-area" class="status-area hidden">
        <span class="label-blue" style="font-size: 13px;">PATCH NAME:</span>
        <span id="patch-name-display" style="color: var(--esq-gold); font-size: 1.4rem; font-weight: 700; margin-left:10px;">---</span>
        <span id="synth-type-icon"></span>
    </div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        
        // Full Wave Table Mapping
        const WAVES = [
            "SAW", "BELL", "SINE", "SQUARE", "PULSE", "NOISE 1", "NOISE 2", "NOISE 3", "BASS", "PIANO", "EL PNO", "VOICE 1", "VOICE 2", "KICK", "REED", "ORGAN", "SYNTH 1", "SYNTH 2", "SYNTH 3", "FORMT 1", "FORMT 2", "FORMT 3", "FORMT 4", "FORMT 5", "PULSE2", "SQR 2", "4 OCTS", "PRIME", "BASS 2", "E PNO2", "OCTAVE", "OCT+5", "SAW 2", "TRIANG", "REED 2", "REED 3", "GRIT 1", "GRIT 2", "GRIT 3", "GLINT 1", "GLINT 2", "GLINT 3", "CLAV", "BRASS", "STRING", "DIGIT 1", "DIGIT 2", "BELL 2", "ALIEN", "BREATH", "VOICE 3", "STEAM", "METAL", "CHIME", "BOWING", "PICK 1", "PICK 2", "MALLET", "SLAP", "PLINK", "PLUCK", "PLUNK", "CLICK", "CHIFF", "THUMP", "LOGDRM", "KICK 2", "SNARE", "TOMTOM", "HI HAT", "DRUMS 1", "DRUMS 2", "DRUMS 3", "DRUMS 4", "DRUMS 5"
        ];
        // Pad the rest with WAV075...WAV255
        for(let i=75; i<=255; i++) { WAVES.push("WAV" + (i+1).toString().padStart(3, '0')); }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const toSigned = (val) => (val & 0x80) ? -(val ^ 0xFF) - 1 : Math.floor(val/2);

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

        function handleFile(file) {
            if (!file) return;
            document.getElementById('filename-display').innerText = file.name.toUpperCase();
            document.getElementById('file-info-bar').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        }

        let patches = [];

        function process(data) {
            let unpacked = [];
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }
            patches = [];
            const pcbSize = 102;
            const total = Math.floor(unpacked.length / pcbSize);

            document.getElementById('bank-container').classList.toggle('hidden', total <= 1);
            const typeIcon = document.getElementById('file-type-icon');
            typeIcon.innerText = total > 1 ? "BANK" : "SINGLE PATCH";
            typeIcon.className = total > 1 ? "type-icon icon-bank" : "type-icon icon-single";

            for (let i = 0; i < total; i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                let name = "";
                for(let n=0; n<6; n++) { name += String.fromCharCode(pcb[n] & 0x7F); }
                patches.push({ name: name.trim(), pcb: pcb });
            }
            renderBanks();
            if (patches.length > 0) displayParameters(patches[0]);
        }

        function renderBanks() {
            for (let b = 0; b < 4; b++) {
                const list = document.getElementById(`bank-${b}`);
                list.innerHTML = '';
                for (let p = 0; p < 10; p++) {
                    const idx = (b * 10) + p;
                    if (!patches[idx]) break;
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = patches[idx].name;
                    div.onclick = () => displayParameters(patches[idx]);
                    list.appendChild(div);
                }
            }
        }

        function displayParameters(patch) {
            document.getElementById('status-area').classList.remove('hidden');
            document.getElementById('patch-name-display').innerText = patch.name;
            const pcb = patch.pcb;

            // --- 3-LEVEL DETECTION ---
            let lvl1 = false, lvl2 = false, lvl3 = false;
            for(let e=0; e<4; e++) {
                let base = 6 + (e * 10);
                if (pcb[base+9] & 0x80) lvl1 = true;
                if (pcb[base+2] & 0x80) lvl2 = true;
            }
            if (pcb[63] > 31 || pcb[73] > 31 || pcb[83] > 31) lvl3 = true;

            const badge = document.getElementById('synth-type-icon');
            if (lvl1 && lvl2 && lvl3) {
                badge.innerText = "SQ-80"; badge.className = "synth-type-badge badge-sq80";
            } else if (lvl1 || lvl2) {
                badge.innerText = "PROBABLE SQ-80"; badge.className = "synth-type-badge badge-sq80-prob";
            } else if (lvl3) {
                badge.innerText = "POSSIBLE SQ-80 / HIDDEN WAVE"; badge.className = "synth-type-badge badge-sq80-poss";
            } else {
                badge.innerText = "ESQ-1"; badge.className = "synth-type-badge badge-esq";
            }

            const db = document.getElementById('dashboard');
            db.innerHTML = '';

            for(let i=1; i<=3; i++) {
                let base = 58 + (i-1)*10;
                let semi = pcb[base] & 0x7F;
                let wIdx = pcb[base+5];
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">OSCILLATOR ${i}</div>
                        <div class="param-grid-row">
                            <div class="cell"><span class="label">OCT</span><span class="num">${Math.floor(semi/12)-3}</span></div>
                            <div class="cell"><span class="label">SEMI</span><span class="num">${semi%12}</span></div>
                            <div class="cell"><span class="label">FINE</span><span class="num">${pcb[base+1]}</span></div>
                            <div class="cell">
                                <span class="label">WAVE</span>
                                <span class="wave-num">WAVE ${wIdx + 1}</span>
                                <span class="wave-name">${WAVES[wIdx] || "---"}</span>
                            </div>
                        </div>
                        <div class="param-grid-row">
                            <div class="cell"><span class="label">MOD 1</span><span class="src">${MODS[pcb[base+2]&0x0F]}</span><span class="num">${toSigned(pcb[base+3])}</span></div>
                            <div class="cell"><span class="label">MOD 2</span><span class="src">${MODS[pcb[base+2]>>4]}</span><span class="num">${toSigned(pcb[base+4])}</span></div>
                        </div>
                    </div>
                `;
            }

            // Standard layout placeholders
            for(let i=0; i<3; i++) db.innerHTML += `<div class="module span-4"><div class="module-header">DCA ${i+1}</div></div>`;
            for(let i=0; i<3; i++) db.innerHTML += `<div class="module span-4"><div class="module-header">LFO ${i+1}</div></div>`;
            for(let i=0; i<4; i++) db.innerHTML += `<div class="module span-3"><div class="module-header">ENV ${i+1}</div></div>`;
            ['FILTER','MODES','SPLIT/LAYER','DCA 4'].forEach(t => {
                db.innerHTML += `<div class="module span-3"><div class="module-header">${t}</div></div>`;
            });
        }
    </script>
</body>
</html>
