<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 / ESQ-1 Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 20px; line-height: 1.5; }
        
        /* Drop Zone */
        #drop-zone {
            width: 100%; height: 100px; border: 2px dashed #444;
            display: flex; align-items: center; justify-content: center;
            background: #252525; cursor: pointer; margin-bottom: 15px;
            transition: all 0.2s ease;
        }
        #drop-zone:hover { border-color: #0078d4; background: #2a2a2a; }
        
        /* Status & Summary Line */
        #status-bar { 
            background: #333; padding: 10px 15px; border-radius: 4px; 
            margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;
            border-left: 4px solid #555;
        }
        .tag { font-size: 0.8rem; padding: 3px 8px; border-radius: 3px; font-weight: bold; text-transform: uppercase; }
        .tag-sq80 { background: #d4a017; color: #000; }
        .tag-esq1 { background: #27ae60; color: #fff; }

        /* Grid for Bank View */
        .patch-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px; margin-bottom: 30px;
        }
        .patch-item {
            background: #2d2d2d; padding: 12px 5px; border-radius: 3px; cursor: pointer;
            text-align: center; border: 1px solid #3d3d3d; font-size: 0.9rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .patch-item:hover { background: #3d3d3d; border-color: #0078d4; }
        .patch-item.selected { background: #0078d4; color: white; border-color: #fff; }

        /* Editor Section */
        .editor-container { display: none; background: #252525; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #111; color: #888; }
        tr:nth-child(even) { background: #2a2a2a; }
    </style>
</head>
<body>

    <h2>Ensoniq Librarian</h2>
    
    <div id="drop-zone">Drag & Drop .SYX / .MDX or Click</div>
    <input type="file" id="file-input" accept=".syx,.mdx" style="display: none;">

    <div id="status-bar">
        <span id="file-info">No file loaded</span>
        <span id="model-badge"></span>
    </div>

    <div id="patch-list" class="patch-grid"></div>

    <div id="editor" class="editor-container">
        <h3 id="current-patch-name">Patch Editor</h3>
        <table>
            <thead>
                <tr>
                    <th>Parameter</th>
                    <th>Value</th>
                    <th>Hex</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="param-table-body"></tbody>
        </table>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const patchList = document.getElementById('patch-list');
        const fileInfo = document.getElementById('file-info');
        const modelBadge = document.getElementById('model-badge');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            const file = files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => processSysEx(new Uint8Array(e.target.result), file.name);
            reader.readAsArrayBuffer(file);
        }

        function unpackNibbles(data, start) {
            let pcb = new Uint8Array(102);
            for (let i = 0; i < 102; i++) {
                pcb[i] = (data[start + (i * 2)] << 4) | (data[start + (i * 2) + 1] & 0x0F);
            }
            return pcb;
        }

        function detectModel(pcb) {
            let sq80Markers = 0;
            [0, 5, 10].forEach(off => { if(pcb[off] > 31) sq80Markers++; }); // Waves
            if (pcb[22] & 0x40) sq80Markers++; // 2nd Release
            [42, 54, 66, 78].forEach(off => { if(pcb[off] & 0x40) sq80Markers++; }); // Env Lin/Exp
            return sq80Markers > 0 ? 'SQ80' : 'ESQ1';
        }

        function processSysEx(data, filename) {
            if (data[0] !== 0xF0 || data[1] !== 0x0F) return alert("Invalid Ensoniq SysEx");

            patchList.innerHTML = '';
            let patches = [];
            let bankHasSQ80 = false;

            if (data.length < 500) {
                const pcb = unpackNibbles(data, 10);
                if(detectModel(pcb) === 'SQ80') bankHasSQ80 = true;
                patches.push({ name: extractName(pcb), pcb: pcb });
            } else {
                let offset = 10;
                for (let i = 0; i < 40; i++) {
                    const pcb = unpackNibbles(data, offset);
                    if(detectModel(pcb) === 'SQ80') bankHasSQ80 = true;
                    patches.push({ name: extractName(pcb), pcb: pcb });
                    offset += 204;
                }
            }

            // Update the Status Line once
            fileInfo.innerText = `${filename} (${patches.length} Patches)`;
            modelBadge.innerHTML = bankHasSQ80 
                ? `<span class="tag tag-sq80">SQ-80 Data Detected</span>` 
                : `<span class="tag tag-esq1">ESQ-1 Compatible</span>`;

            renderGrid(patches);
        }

        function extractName(pcb) {
            return String.fromCharCode(...pcb.slice(94, 100)).trim() || "UNTITL";
        }

        function renderGrid(patches) {
            patches.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'patch-item';
                div.innerText = p.name;
                div.onclick = function() {
                    document.querySelectorAll('.patch-item').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    loadPatchToEditor(p);
                };
                patchList.appendChild(div);
            });
        }

        function loadPatchToEditor(patch) {
            document.getElementById('editor').style.display = 'block';
            document.getElementById('current-patch-name').innerText = `Patch: ${patch.name}`;
            const tbody = document.getElementById('param-table-body');
            tbody.innerHTML = '';

            const params = [
                { n: "OSC 1 Wave", v: patch.pcb[0] },
                { n: "Filter Cutoff", v: patch.pcb[20] },
                { n: "Filter Res", v: patch.pcb[21] },
                { n: "AM / Mode", v: patch.pcb[22], d: (patch.pcb[22] & 0x40 ? "SQ80 2nd Rel ON" : "Standard") }
            ];

            params.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.n}</td><td>${p.v}</td><td>${p.v.toString(16).toUpperCase()}</td><td>${p.d || ''}</td></tr>`;
            });
        }
    </script>
</body>
</html>
