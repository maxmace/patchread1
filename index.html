<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --accent: #4a90e2; 
            --text: #dcdcdc; --border: #333; --label: #777;
            --esq-gold: #f1c40f; --sq80-fixed: #3498db;
            --tooltip-bg: #2c3e50; --glass: rgba(255, 255, 255, 0.03);
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        #drop-zone { width: 100%; height: 60px; border: 2px dashed #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #1e1e1e; cursor: pointer; color: var(--accent); margin-bottom: 15px; transition: border-color 0.3s; }
        #drop-zone:hover { border-color: var(--accent); }

        .file-info-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 13px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
        .label-blue { color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        .type-icon { padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 10px; color: white; letter-spacing: 1px; }
        .icon-bank { background: #27ae60; }
        .icon-single { background: #8e44ad; }

        .bank-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
        .bank-block { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .bank-header { font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 12px; font-size: 11px; letter-spacing: 1px; }
        .patch-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .patch-item { font-size: 11px; padding: 8px 4px; background: #252525; text-align: center; cursor: pointer; border: 1px solid #333; border-radius: 4px; transition: 0.2s; }
        .patch-item:hover { background: #333; }
        .patch-item.selected { background: var(--accent); color: #fff; border-color: #fff; }

        .status-area { margin-bottom: 30px; padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent); background: linear-gradient(to right, #1a1a1a, #121212); display: flex; align-items: center; gap: 15px; }
        .patch-type-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 3px; color: #fff; text-transform: uppercase; }
        .badge-esq { background: #e67e22; }
        .badge-sq80 { background: #2980b9; }
        .badge-hidden { background: #c0392b; }

        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; }
        
        .module { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; position: relative; overflow: visible; }
        .span-4 { grid-column: span 4; }
        .span-3 { grid-column: span 3; }
        
        .module-header { background: var(--glass); font-size: 10px; font-weight: 800; color: var(--accent); padding: 8px 12px; border-bottom: 1px solid var(--border); border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .param-grid-row { display: flex; border-bottom: 1px solid var(--border); width: 100%; }
        .param-grid-row:last-child { border-bottom: none; }
        
        .cell { flex: 1; padding: 8px 4px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; min-height: 48px; }
        .cell:last-child { border-right: none; }
        
        .label { font-size: 8px; color: var(--label); text-transform: uppercase; margin-bottom: 2px; line-height: 1; pointer-events: none; }
        .num { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; }
        .mod-container { display: flex; align-items: center; justify-content: center; width: 100%; }
        .mod-src { color: #aaa; font-size: 10px; font-weight: 600; }
        .mod-star { color: var(--label); font-size: 14px; padding: 0 2px; }
        .mod-val { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .wave-name { color: #fff; font-size: 10px; font-weight: bold; }

        .cell[data-tooltip]::after { 
            content: attr(data-tooltip); 
            position: absolute; 
            bottom: 110%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 200px; 
            padding: 10px; 
            border-radius: 6px; 
            background: var(--tooltip-bg); 
            color: #fff; 
            font-size: 11px; 
            visibility: hidden; 
            opacity: 0; 
            z-index: 9999; 
            transition: opacity 0.15s ease; 
            border: 1px solid rgba(255,255,255,0.2); 
            pointer-events: none; 
            text-transform: none; 
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .cell[data-tooltip]:hover::after { visibility: visible; opacity: 1; }
        
        .module:nth-child(3n) .cell:last-child[data-tooltip]::after,
        .module.span-3:nth-child(4n) .cell:last-child[data-tooltip]::after {
            left: auto;
            right: 0;
            transform: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="drop-zone">Drop ESQ/SQ-80 SysEx Files Here</div>
    <input type="file" id="file-input" style="display: none;">
    
    <div id="file-info-bar" class="file-info-bar hidden">
        <span class="label-blue">FILE NAME: </span><span id="filename-display" style="color: #eee; margin-right: 10px;"></span>
        <span id="file-type-icon" class="type-icon"></span>
    </div>

    <div id="bank-container" class="bank-container hidden">
        <div class="bank-block"><div class="bank-header">INT 1 (1-10)</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2 (11-20)</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3 (21-30)</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4 (31-40)</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="status-area" class="status-area hidden">
        <div>
            <span class="label-blue">PATCH NAME:</span>
            <span id="patch-name-display" style="color: var(--esq-gold); font-size: 1.4rem; font-weight: 700; margin-left:10px;">---</span>
        </div>
        <div id="patch-type-container"></div>
    </div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        const WAVES = ["SAW", "BELL", "SINE", "SQUARE", "PULSE", "NOISE 1", "NOISE 2", "NOISE 3", "BASS", "PIANO", "EL PNO", "VOICE 1", "VOICE 2", "KICK", "REED", "ORGAN", "SYNTH 1", "SYNTH 2", "SYNTH 3", "FORMT 1", "FORMT 2", "FORMT 3", "FORMT 4", "FORMT 5", "PULSE2", "SQR 2", "4 OCTS", "PRIME", "BASS 2", "E PNO2", "OCTAVE", "OCT+5", "SAW 2", "TRIANG", "REED 2", "REED 3", "GRIT 1", "GRIT 2", "GRIT 3", "GLINT 1", "GLINT 2", "GLINT 3", "CLAV", "BRASS", "STRING", "DIGIT 1", "DIGIT 2", "BELL 2", "ALIEN", "BREATH", "VOICE 3", "STEAM", "METAL", "CHIME", "BOWING", "PICK 1", "PICK 2", "MALLET", "SLAP", "PLINK", "PLUCK", "PLUNK", "CLICK", "CHIFF", "THUMP", "LOGDRM", "KICK 2", "SNARE", "TOMTOM", "HI HAT", "DRUMS 1", "DRUMS 2", "DRUMS 3", "DRUMS 4", "DRUMS 5"];

        const HINTS = {
            OSC: {
                oct: "OCTAVE -- Sets basic pitch in octave steps from -3 to +3.",
                semi: "SEMITONE -- Adjusts pitch in semitone steps (0-11).",
                fine: "FINE -- Fine-tunes pitch in very small increments (0-31).",
                wave: "WAVEFORM -- Selects the digital oscillator waveform or multisample.",
                mod1: "MOD 1 -- First modulation source for oscillator pitch.",
                mod2: "MOD 2 -- Second modulation source for oscillator pitch."
            },
            DCA: {
                lvl: "LEVEL -- Sets the volume level for this DCA (0-63).",
                out: "OUTPUT -- Determines if this DCA is sent to the Filter/Mixer.",
                mod1: "MOD 1 -- Modulation source for DCA volume/amplitude.",
                mod2: "MOD 2 -- Second modulation source for DCA volume."
            },
            LFO: {
                freq: "LFO FREQ -- Determines speed of the LFO (0-63).",
                reset: "RESET -- When ON, LFO restarts its cycle on every key strike.",
                human: "HUMAN -- When ON, adds random fluctuations to LFO speed.",
                wav: "WAV -- Selects LFO shape: Triangle, Sawtooth, Square, or Noise.",
                l1: "LEVEL 1 -- The initial depth of the LFO.",
                delay: "DELAY -- Determines how long it takes for LFO to ramp from L1 to L2.",
                l2: "LEVEL 2 -- The final depth of the LFO.",
                mod: "MOD -- Mod source to control the LFO's overall depth."
            },
            ENV: {
                l1: "LEVEL 1 -- Peak level reached at the end of Time 1.",
                l2: "LEVEL 2 -- Level reached at the end of Time 2.",
                l3: "LEVEL 3 -- Sustain level held after Time 3 until key release.",
                lv: "LEVEL VELOCITY -- Determines how much key velocity scales the overall envelope levels (L=Linear, X=Exponential).",
                t1v: "T1 ATTACK VEL -- Determines how much key velocity shortens the Attack Time (T1).",
                t1: "TIME 1 -- Attack time from zero to Level 1.",
                t2: "TIME 2 -- Decay time from Level 1 to Level 2.",
                t3: "TIME 3 -- Decay/Slope time from Level 2 to Level 3 (Sustain).",
                t4: "TIME 4 -- Release time. Values with 'R' indicate a second release stage enabled.",
                kbd: "KBD TRACK -- Determines how much higher notes shorten envelope times."
            },
            FILTER: {
                freq: "FREQ -- Cutoff frequency of the 4-pole low-pass filter (0-127).",
                res: "RES -- Resonance/Q. Higher values emphasize the cutoff point.",
                kbd: "KBD -- How much filter cutoff follows the keyboard pitch.",
                mod1: "MOD 1 -- Mod source for filter frequency (often ENV2).",
                mod2: "MOD 2 -- Second mod source for filter frequency (often LFO or Pressure)."
            },
            MODE: {
                sync: "SYNC -- Forces Osc 2 to restart whenever Osc 1 starts a new cycle.",
                am: "AM -- Amplitude Modulation. Osc 1 is multiplied by Osc 2 for bell-like tones.",
                mono: "MONO -- Limits the synth to playing one note at a time.",
                rev: "RE-VOICE -- Restarts the entire voice cycle on every key strike.",
                ree: "RE-ENV -- Restarts all envelopes from zero on every key strike.",
                rew: "RE-WAV -- Restarts oscillator waveforms at 0 degrees on every key strike.",
                full: "FULL CYCLE -- Forces envelopes to complete their full cycle regardless of when key is released."
            },
            SPLIT: {
                status: "S/L STATUS -- Enables Split or Layer functionality.",
                slprog: "S/L PROG -- The patch number used for the Split or Layer.",
                layer: "LAYER -- Enables playing two patches simultaneously across the keyboard.",
                lprog: "LAYER PROG -- Patch number used for the Layer sound.",
                split: "SPLIT -- Splits the keyboard into two zones with different patches.",
                sprog: "SPLIT PROG -- Patch number used for the Split sound.",
                key: "SPLIT-KEY -- The MIDI key number where the split occurs."
            },
            DCA4: {
                pan: "PAN -- Sets the voice's position in the stereo field.",
                mod1: "MODULATOR 1 -- Hard-coded to Envelope 4 for master amplitude.",
                mod2: "MODULATOR 2 -- Second mod source for master volume (often Pressure or Pedal)."
            }
        };

        const toSigned = (val) => (val & 0x80) ? -(val ^ 0xFF) - 1 : Math.floor(val/2);
        
        const renderCell = (label, value, tooltip = "") => `
            <div class="cell" ${tooltip ? `data-tooltip="${tooltip}"` : ""}>
                <span class="label">${label}</span>
                <span class="num">${value}</span>
            </div>`;

        const renderMod = (label, srcIdx, val, tooltip = "") => `
            <div class="cell" ${tooltip ? `data-tooltip="${tooltip}"` : ""}>
                <span class="label">${label}</span>
                <div class="mod-container">
                    <span class="mod-src">${MODS[srcIdx]}</span>
                    <span class="mod-star">*</span>
                    <span class="mod-val">${toSigned(val)}</span>
                </div>
            </div>`;

        let patches = [];
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

        function handleFile(file) {
            if (!file) return;
            document.getElementById('filename-display').innerText = file.name.toUpperCase();
            document.getElementById('file-info-bar').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        }

        function process(data) {
            let unpacked = [];
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }
            patches = [];
            const pcbSize = 102;
            const total = Math.floor(unpacked.length / pcbSize);
            
            const typeIcon = document.getElementById('file-type-icon');
            if (total > 1) {
                typeIcon.innerText = "BANK";
                typeIcon.className = "type-icon icon-bank";
                document.getElementById('bank-container').classList.remove('hidden');
            } else {
                typeIcon.innerText = "SINGLE";
                typeIcon.className = "type-icon icon-single";
                document.getElementById('bank-container').classList.add('hidden');
            }

            for (let i = 0; i < total; i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                let name = "";
                for(let n=0; n<6; n++) { name += String.fromCharCode(pcb[n] & 0x7F); }
                patches.push({ name: name.trim() || "UNTITL", pcb: pcb });
            }
            renderBanks();
            if (patches.length > 0) displayParameters(patches[0]);
        }

        function renderBanks() {
            for (let b = 0; b < 4; b++) {
                const list = document.getElementById(`bank-${b}`);
                list.innerHTML = '';
                for (let p = 0; p < 10; p++) {
                    const idx = (b * 10) + p;
                    if (!patches[idx]) break;
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = patches[idx].name;
                    div.onclick = () => {
                        document.querySelectorAll('.patch-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        displayParameters(patches[idx]);
                    };
                    list.appendChild(div);
                }
            }
        }

        function resolveName(num) {
            return (patches[num]) ? `${patches[num].name}` : num.toString().padStart(2, '0');
        }

        function updateTypeIcons(pcb) {
            const container = document.getElementById('patch-type-container');
            container.innerHTML = '';
            
            // Check oscillators for wave indices
            let waves = [pcb[63], pcb[73], pcb[83]];
            let isSQ80 = waves.some(w => w >= 32 && w <= 74);
            let isHidden = waves.some(w => w > 74);

            if (isHidden) {
                container.innerHTML += `<span class="patch-type-badge badge-hidden">Hidden Waves</span>`;
            } else if (isSQ80) {
                container.innerHTML += `<span class="patch-type-badge badge-sq80">SQ-80</span>`;
            } else {
                container.innerHTML += `<span class="patch-type-badge badge-esq">ESQ-1</span>`;
            }
        }

        function displayParameters(patch) {
            document.getElementById('status-area').classList.remove('hidden');
            document.getElementById('patch-name-display').innerText = patch.name;
            const pcb = patch.pcb;
            const db = document.getElementById('dashboard');
            db.innerHTML = '';

            updateTypeIcons(pcb);

            // ROW 1: OSCILLATORS
            for(let i=1; i<=3; i++) {
                let base = 58 + (i-1)*10;
                let semi = pcb[base] & 0x7F;
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">OSCILLATOR ${i}</div>
                        <div class="param-grid-row">
                            ${renderCell('OCT', Math.floor(semi/12)-3, HINTS.OSC.oct)}
                            ${renderCell('SEMI', semi%12, HINTS.OSC.semi)}
                            ${renderCell('FINE', pcb[base+1], HINTS.OSC.fine)}
                            <div class="cell" data-tooltip="${HINTS.OSC.wave}"><span class="label">WAVE</span><span class="wave-name">${WAVES[pcb[base+5]] || "---"}</span></div>
                        </div>
                        <div class="param-grid-row">
                            ${renderMod('MOD 1', pcb[base+2]&0x0F, pcb[base+3], HINTS.OSC.mod1)}
                            ${renderMod('MOD 2', pcb[base+2]>>4, pcb[base+4], HINTS.OSC.mod2)}
                        </div>
                    </div>`;
            }

            // ROW 2: DCA 1-3
            for(let i=1; i<=3; i++) {
                let base = 64 + (i-1)*10;
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">DCA ${i}</div>
                        <div class="param-grid-row">
                            ${renderCell('LEVEL', pcb[base], HINTS.DCA.lvl)}
                            <div class="cell"></div>
                            ${renderCell('OUTPUT', (pcb[base+5]&0x01)?"ON":"OFF", HINTS.DCA.out)}
                        </div>
                        <div class="param-grid-row">
                            ${renderMod('MOD 1', pcb[base+1]&0x0F, pcb[base+2], HINTS.DCA.mod1)}
                            ${renderMod('MOD 2', pcb[base+1]>>4, pcb[base+3], HINTS.DCA.mod2)}
                        </div>
                    </div>`;
            }

            // ROW 3: LFO 1-3
            for(let i=1; i<=3; i++) {
                let base = 36 + (i-1)*6; 
                let wIdx = (pcb[base+1]>>2)&0x03;
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">LFO ${i}</div>
                        <div class="param-grid-row">
                            ${renderCell('FREQ', pcb[base], HINTS.LFO.freq)}
                            ${renderCell('RESET', (pcb[base+1]&0x01)?"ON":"OFF", HINTS.LFO.reset)}
                            ${renderCell('HUMAN', (pcb[base+1]&0x02)?"ON":"OFF", HINTS.LFO.human)}
                            <div class="cell" data-tooltip="${HINTS.LFO.wav}"><span class="label">WAV</span><span class="wave-name">${["TRI","SAW","SQR","NOISE"][wIdx]}</span></div>
                        </div>
                        <div class="param-grid-row">
                            ${renderCell('LEVEL 1', pcb[base+5], HINTS.LFO.l1)}
                            ${renderCell('DELAY', pcb[base+2], HINTS.LFO.delay)}
                            ${renderCell('LEVEL 2', pcb[base+5], HINTS.LFO.l2)}
                            ${renderMod('MOD', pcb[base+3]&0x0F, pcb[base+4], HINTS.LFO.mod)}
                        </div>
                    </div>`;
            }

            // ROW 4: ENVELOPES (2-line, 5-column)
            for(let i=1; i<=4; i++) {
                let base = 6 + (i-1)*10;
                let velDisp = (pcb[base+8] > 63) ? `${pcb[base+8]-64}X` : `${pcb[base+8]}L`;
                let t4Disp = (pcb[base+7] > 63) ? `${pcb[base+7]-64}R` : `${pcb[base+7]}`;
                db.innerHTML += `
                    <div class="module span-3">
                        <div class="module-header">ENV ${i}</div>
                        <div class="param-grid-row">
                            ${renderCell('LEVEL 1', toSigned(pcb[base]), HINTS.ENV.l1)}
                            ${renderCell('LEVEL 2', toSigned(pcb[base+1]), HINTS.ENV.l2)}
                            ${renderCell('LEVEL 3', toSigned(pcb[base+2]), HINTS.ENV.l3)}
                            ${renderCell('LVL VEL', velDisp, HINTS.ENV.lv)}
                            ${renderCell('T1 ATK VEL', pcb[base+9], HINTS.ENV.t1v)}
                        </div>
                        <div class="param-grid-row">
                            ${renderCell('TIME 1', pcb[base+3], HINTS.ENV.t1)}
                            ${renderCell('TIME 2', pcb[base+4], HINTS.ENV.t2)}
                            ${renderCell('TIME 3', pcb[base+5], HINTS.ENV.t3)}
                            ${renderCell('TIME 4', t4Disp, HINTS.ENV.t4)}
                            ${renderCell('KBD TRACK', pcb[base+6], HINTS.ENV.kbd)}
                        </div>
                    </div>`;
            }

            // ROW 5: MASTER PAGES
            // Filter
            db.innerHTML += `
                <div class="module span-3">
                    <div class="module-header">FILTER</div>
                    <div class="param-grid-row">
                        ${renderCell('FREQ', pcb[46], HINTS.FILTER.freq)}
                        ${renderCell('RES (Q)', pcb[47], HINTS.FILTER.res)}
                        ${renderCell('KBD', pcb[48], HINTS.FILTER.kbd)}
                    </div>
                    <div class="param-grid-row">
                        ${renderMod('MOD 1', pcb[49]&0x0F, pcb[50], HINTS.FILTER.mod1)}
                        ${renderMod('MOD 2', pcb[49]>>4, pcb[51], HINTS.FILTER.mod2)}
                    </div>
                </div>`;

            // Mode
            db.innerHTML += `
                <div class="module span-3">
                    <div class="module-header">MODE</div>
                    <div class="param-grid-row">
                        ${renderCell('SYNC', (pcb[52]&0x01)?"ON":"OFF", HINTS.MODE.sync)}
                        ${renderCell('AM', (pcb[52]&0x02)?"ON":"OFF", HINTS.MODE.am)}
                        ${renderCell('MONO', (pcb[52]&0x04)?"ON":"OFF", HINTS.MODE.mono)}
                    </div>
                    <div class="param-grid-row">
                        ${renderCell('RE-VOICE', (pcb[52]&0x10)?"ON":"OFF", HINTS.MODE.rev)}
                        ${renderCell('RE-ENV', (pcb[52]&0x08)?"ON":"OFF", HINTS.MODE.ree)}
                        ${renderCell('RE-WAV', (pcb[53]&0x01)?"ON":"OFF", HINTS.MODE.rew)}
                        ${renderCell('FULL CYC', (pcb[53]&0x02)?"ON":"OFF", HINTS.MODE.full)}
                    </div>
                </div>`;

            // Split/Layer
            db.innerHTML += `
                <div class="module span-3">
                    <div class="module-header">SPLIT/LAYER</div>
                    <div class="param-grid-row">
                        ${renderCell('S/L STATUS', (pcb[95]&0x01)?"ON":"OFF", HINTS.SPLIT.status)}
                        ${renderCell('S/L PROG', resolveName(pcb[94]), HINTS.SPLIT.slprog)}
                        ${renderCell('LAYER', (pcb[95]&0x02)?"ON":"OFF", HINTS.SPLIT.layer)}
                        ${renderCell('PROG', resolveName(pcb[96]))}
                    </div>
                    <div class="param-grid-row">
                        ${renderCell('SPLIT', (pcb[95]&0x04)?"ON":"OFF", HINTS.SPLIT.split)}
                        ${renderCell('PROG', resolveName(pcb[97]), HINTS.SPLIT.sprog)}
                        ${renderCell('SPLIT-KEY', pcb[98].toString().padStart(3,'0'), HINTS.SPLIT.key)}
                    </div>
                </div>`;

            // DCA4
            db.innerHTML += `
                <div class="module span-3">
                    <div class="module-header">DCA4 FINAL</div>
                    <div class="param-grid-row">
                        ${renderCell('PAN', toSigned(pcb[92]), HINTS.DCA4.pan)}
                    </div>
                    <div class="param-grid-row">
