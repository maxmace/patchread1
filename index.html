<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --accent: #4a90e2;
            --text: #dcdcdc;
            --border: #444;
            --label: #999;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        /* Fixed Drop Zone */
        #drop-zone {
            width: 100%;
            height: 100px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            cursor: pointer;
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent);
        }

        /* 2x2 Bank Grid */
        .bank-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .bank-block {
            background: #222;
            border: 1px solid var(--border);
            padding: 10px;
        }

        .bank-header {
            font-weight: bold;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
            color: var(--accent);
        }

        .patch-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .patch-item {
            font-size: 11px;
            padding: 6px 2px;
            background: #2d2d2d;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .patch-item:hover { border-color: var(--accent); }
        .patch-item.selected { background: var(--accent); color: #fff; }

        /* Dashboard Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        /* Enforce table-like grid on desktop */
        @media (min-width: 900px) {
            .dashboard {
                grid-template-columns: repeat(4, 1fr);
            }
            .full-row { grid-column: span 1; }
        }

        .module {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 4px;
        }

        .module-header {
            font-size: 10px;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .val-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .label { color: var(--label); }
        .num { color: #5dade2; font-family: monospace; }
        
        h2 { margin-top: 0; font-weight: 300; }
    </style>
</head>
<body>

    <div id="drop-zone">
        Drop ESQ/SQ-80 System Exclusive files here.<br>
        Click to load manually via file selector.
    </div>
    <input type="file" id="file-input" style="display: none;">

    <h2 id="current-patch-display">No Patch Selected</h2>

    <div id="bank-container" class="bank-container">
        <div class="bank-block"><div class="bank-header">INT 1</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // PREVENT BROWSER DOWNLOAD/OPEN
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
            dropZone.addEventListener(e, (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
            }, false);
        });

        dropZone.addEventListener('drop', (ev) => {
            const file = ev.dataTransfer.files[0];
            handleFile(file);
        });

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        }

        function toSigned(val) {
            let out = (val & 0x80) ? -(val ^ 0xFF) - 1 : val;
            return Math.floor(out / 2);
        }

        let patches = [];

        function process(data) {
            let unpacked = [];
            // Assuming Offset 5 for standard Ensoniq Bulk Dumps
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }

            patches = [];
            const pcbSize = 102;
            const totalPatches = Math.floor(unpacked.length / pcbSize);

            for (let i = 0; i < totalPatches; i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                let name = "";
                for(let n=0; n<6; n++) {
                    name += String.fromCharCode(pcb[n] & 0x7F);
                }
                patches.push({ name: name.trim() || "UNTITLED", pcb: pcb });
            }
            renderBanks();
        }

        function renderBanks() {
            for (let b = 0; b < 4; b++) {
                const list = document.getElementById(`bank-${b}`);
                list.innerHTML = '';
                // 10 patches per bank (2 rows of 5)
                for (let p = 0; p < 10; p++) {
                    const idx = (b * 10) + p;
                    if (!patches[idx]) break;
                    
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = patches[idx].name;
                    div.onclick = () => {
                        document.querySelectorAll('.patch-item').forEach(el=>el.classList.remove('selected'));
                        div.classList.add('selected');
                        displayParameters(patches[idx]);
                    };
                    list.appendChild(div);
                }
            }
        }

        function createModule(title, params) {
            let html = `<div class="module"><div class="module-header">${title}</div>`;
            params.forEach(p => {
                html += `<div class="val-row"><span class="label">${p.l}</span><span class="num">${p.v}</span></div>`;
            });
            return html + `</div>`;
        }

        function displayParameters(patch) {
            const pcb = patch.pcb;
            const db = document.getElementById('dashboard');
            document.getElementById('current-patch-display').innerText = patch.name;
            db.innerHTML = '';

            // ROW 1: OSCs
            for(let i=0; i<3; i++) {
                let base = 58 + (i * 10);
                db.innerHTML += createModule(`OSC ${i+1}`, [
                    {l: 'WAVE', v: pcb[base+5]},
                    {l: 'SEMI', v: pcb[base] & 0x7F},
                    {l: 'MOD1', v: MODS[pcb[base+2] & 0x0F]}
                ]);
            }
            db.innerHTML += `<div class="module" style="visibility:hidden"></div>`; // Spacer

            // ROW 2: DCAs
            for(let i=0; i<3; i++) {
                let base = 58 + (i * 10);
                db.innerHTML += createModule(`DCA ${i+1}`, [
                    {l: 'LEVEL', v: (pcb[base+6] >> 1) & 0x3F},
                    {l: 'MOD1', v: MODS[pcb[base+7] & 0x0F]}
                ]);
            }
            db.innerHTML += `<div class="module" style="visibility:hidden"></div>`; // Spacer

            // ROW 3: LFOs
            for(let i=0; i<3; i++) {
                let base = 46 + (i * 4);
                db.innerHTML += createModule(`LFO ${i+1}`, [
                    {l: 'FREQ', v: pcb[base]},
                    {l: 'WAVE', v: pcb[base+2]}
                ]);
            }
            db.innerHTML += `<div class="module" style="visibility:hidden"></div>`; // Spacer

            // ROW 4: ENVs
            for(let i=0; i<4; i++) {
                let base = 6 + (i * 10);
                db.innerHTML += createModule(`ENV ${i+1}`, [
                    {l: 'L1', v: toSigned(pcb[base])},
                    {l: 'T1', v: pcb[base+3]}
                ]);
            }

            // ROW 5: BOTTOM ROW
            db.innerHTML += createModule('FILTER', [
                {l: 'FREQ', v: pcb[89] & 0x3F},
                {l: 'RES', v: pcb[90] & 0x1F}
            ]);
            db.innerHTML += createModule('MODES', [{l: 'GLIDE', v: pcb[97]}]);
            db.innerHTML += createModule('SPLIT/LAYER', [{l: 'S-PROG', v: pcb[98]}]);
            db.innerHTML += createModule('DCA 4', [{l: 'DEPTH', v: pcb[88]}]);
        }
    </script>
</body>
</html>
