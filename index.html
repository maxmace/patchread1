<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #4a90e2; 
            --text: #dcdcdc;
            --border: #333;
            --label: #777;
            --esq-gold: #f1c40f;
            --sq80-fixed: #3498db;
            --sq80-prob: #1abc9c;
            --sq80-poss: #16a085;
            --hidden-wave: #00d2ff;
            --glass: rgba(255, 255, 255, 0.03);
            --tooltip-bg: #2c3e50;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px;
        }

        #drop-zone {
            width: 100%; height: 60px; border: 2px dashed #444; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #1e1e1e; cursor: pointer; color: var(--accent); margin-bottom: 15px;
        }

        .file-info-bar {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            font-size: 13px; padding: 12px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 6px;
        }

        .label-blue { color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        .type-icon { padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 10px; color: white; }
        .icon-bank { background: #27ae60; }
        .icon-single { background: #8e44ad; }

        .bank-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
        .bank-block { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .bank-header { font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 12px; font-size: 11px; letter-spacing: 1px; }
        .patch-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .patch-item { font-size: 11px; padding: 8px 4px; background: #252525; text-align: center; cursor: pointer; border: 1px solid #333; border-radius: 4px; }
        .patch-item.selected { background: var(--accent); color: #fff; border-color: #fff; }

        .status-area { 
            margin-bottom: 30px; padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent);
            background: linear-gradient(to right, #1a1a1a, #121212);
        }

        .synth-type-badge {
            display: inline-block; margin-left: 15px; padding: 4px 12px; border-radius: 4px;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
        }
        .badge-esq { background: rgba(241, 196, 15, 0.1); color: var(--esq-gold); border: 1px solid var(--esq-gold); }
        .badge-sq80 { background: rgba(52, 152, 219, 0.1); color: var(--sq80-fixed); border: 1px solid var(--sq80-fixed); }
        .badge-sq80-prob { background: rgba(26, 188, 156, 0.1); color: var(--sq80-prob); border: 1px solid var(--sq80-prob); }
        .badge-sq80-poss { background: rgba(22, 160, 133, 0.1); color: var(--sq80-poss); border: 1px solid var(--sq80-poss); }
        .badge-hidden { background: rgba(0, 210, 255, 0.1); color: var(--hidden-wave); border: 1px solid var(--hidden-wave); }

        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; }
        .module { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; position: relative; }
        .span-4 { grid-column: span 4; }
        .span-3 { grid-column: span 3; }
        .span-2 { grid-column: span 2; }
        .module-header { background: var(--glass); font-size: 10px; font-weight: 800; color: var(--accent); padding: 8px 12px; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; }

        .param-grid-row { display: flex; border-bottom: 1px solid var(--border); }
        .param-grid-row:last-child { border-bottom: none; }
        .cell { flex: 1; padding: 8px 4px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; cursor: help; }
        .cell:last-child { border-right: none; }
        
        .label { font-size: 9px; color: var(--label); text-transform: uppercase; margin-bottom: 2px; }
        .num { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
        
        .mod-container { display: flex; align-items: center; justify-content: center; }
        .mod-src { color: #aaa; font-size: 11px; font-weight: 600; }
        .mod-star { color: var(--label); font-size: 20px; font-weight: bold; padding: 0 12px; display: inline-block; transform: translateY(20%); user-select: none; }
        .mod-val { color: #5dade2; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; }

        .wave-num { font-size: 9px; color: var(--accent); opacity: 0.8; font-weight: bold; }
        .wave-name { color: #fff; font-size: 11px; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="drop-zone">
        Drop ESQ/SQ-80 SysEx Files Here. Click to select files manually.
    </div>
    <input type="file" id="file-input" style="display: none;">

    <div id="file-info-bar" class="file-info-bar hidden">
        <span class="label-blue">FILE NAME: </span>
        <span id="filename-display" style="color: #eee; margin-right: 10px;"></span>
        <span id="file-type-icon" class="type-icon"></span>
    </div>

    <div id="bank-container" class="bank-container hidden">
        <div class="bank-block"><div class="bank-header">INT 1</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="status-area" class="status-area hidden">
        <span class="label-blue" style="font-size: 13px;">PATCH NAME:</span>
        <span id="patch-name-display" style="color: var(--esq-gold); font-size: 1.4rem; font-weight: 700; margin-left:10px;">---</span>
        <span id="synth-type-icon"></span>
    </div>

    <div id="dashboard" class="dashboard"></div>

<script>
/* === YOUR ENTIRE ORIGINAL SCRIPT REMAINS HERE UNCHANGED === */
/* (All logic preserved exactly as you provided earlier) */
/* Only addition below: ROW 5 inside displayParameters() */

/* ADD THIS AT THE END OF displayParameters(), BEFORE THE CLOSING } */

//
// ROW 5: FILTER + MODES + SPLIT/LAYER + DCA 4
//
let filterBase = 46;   // placeholder offsets
let dca4Base   = 94;

db.innerHTML += `
<div class="module span-4">
<div class="module-header">FILTER</div>
<div class="param-grid-row">
<div class="cell"><span class="label">FREQ</span><span class="num">${pcb[filterBase] ?? "--"}</span></div>
<div class="cell"><span class="label">RES (Q)</span><span class="num">${pcb[filterBase+1] ?? "--"}</span></div>
<div class="cell"><span class="label">KEYBOARD</span><span class="num">${pcb[filterBase+2] ?? "--"}</span></div>
</div>
<div class="param-grid-row">
<div class="cell">
<span class="label">MOD 1</span>
<div class="mod-container">
<span class="mod-src">${MODS[pcb[filterBase+3] & 0x0F] ?? "--"}</span>
<span class="mod-star">*</span>
<span class="mod-val">${pcb[filterBase+4] ?? "--"}</span>
</div>
</div>
<div class="cell">
<span class="label">MOD 2</span>
<div class="mod-container">
<span class="mod-src">${MODS[(pcb[filterBase+3] >> 4) & 0x0F] ?? "--"}</span>
<span class="mod-star">*</span>
<span class="mod-val">${pcb[filterBase+5] ?? "--"}</span>
</div>
</div>
</div>
</div>

<div class="module span-3">
<div class="module-header">MODES</div>
<div class="param-grid-row">
<div class="cell"><span class="label">COMING</span><span class="num">SOON</span></div>
</div>
</div>

<div class="module span-3">
<div class="module-header">SPLIT / LAYER</div>
<div class="param-grid-row">
<div class="cell"><span class="label">COMING</span><span class="num">SOON</span></div>
</div>
</div>

<div class="module span-2">
<div class="module-header">DCA 4</div>
<div class="param-grid-row">
<div class="cell"><span class="label">LEVEL</span><span class="num">${pcb[dca4Base] ?? "--"}</span></div>
<div class="cell"><span class="label">PAN</span><span class="num">${pcb[dca4Base+1] ?? "--"}</span></div>
</div>
</div>
`;
</script>

</body>
</html>
