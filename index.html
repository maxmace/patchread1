<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian (Legacy-Corrected)</title>
    <style>
        :root { --bg: #0f0f0f; --panel: #1a1a1a; --accent: #e74c3c; --text: #dcdcdc; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); padding: 20px; }
        #drop-zone { width: 100%; height: 50px; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; background: var(--panel); cursor: pointer; color: var(--accent); font-weight: bold; margin-bottom: 20px; }
        .patch-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-bottom: 20px; }
        .patch-item { background: #222; padding: 10px 5px; text-align: center; border: 1px solid #333; cursor: pointer; font-size: 0.8rem; }
        .patch-item:hover { border-color: var(--accent); }
        .patch-item.selected { background: var(--accent); color: white; }
        
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 2px solid #444; padding-top: 20px; }
        .module { background: #111; border: 1px solid #333; padding: 10px; }
        .module-header { color: var(--accent); font-size: 0.7rem; margin-bottom: 8px; border-bottom: 1px solid #333; }
        .val-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 3px; }
        .label { color: #777; }
        .num { color: #00ff00; }
    </style>
</head>
<body>

    <div id="drop-zone">LOAD SQ-80 SYSEX (OFFSET 5 MODE)</div>
    <input type="file" id="file-input" style="display: none;">
    <div id="bank-view" class="patch-grid"></div>
    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        const WAVES = ["SAW","BELL","SINE","SQUARE","PULSE","NOISE1","NOISE2","NOISE3","BASS","PIANO","ELPNO","VOICE1","VOICE2","KICK","REED","ORGAN"]; // Truncated for example
        
        let patches = [];

        document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function process(data) {
            // THE PHP LOGIC: Start at byte 5, denibble LSN-first
            let unpacked = [];
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }

            patches = [];
            const pcbSize = 102;
            for (let i = 0; i < Math.floor(unpacked.length / pcbSize); i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                // Name is at offset 0-5 per your PHP script
                let name = "";
                for(let n=0; n<6; n++) name += String.fromCharCode(pcb[n] & 0x7F);
                patches.push({ name: name.replace(/[^a-zA-Z0-9\s]/g, ""), pcb: pcb });
            }
            render();
        }

        function render() {
            const view = document.getElementById('bank-view');
            view.innerHTML = '';
            patches.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'patch-item';
                div.innerText = `${i+1}: ${p.name}`;
                div.onclick = () => {
                    document.querySelectorAll('.patch-item').forEach(el=>el.classList.remove('selected'));
                    div.classList.add('selected');
                    draw(p.pcb);
                };
                view.appendChild(div);
            });
        }

        function draw(pcb) {
            const db = document.getElementById('dashboard');
            db.innerHTML = '';
            
            // OSCILLATORS (Based on PHP: Offset 6 + 40 + 12 + osc*10)
            for(let i=0; i<3; i++) {
                let base = 6 + 40 + 12 + (i * 10);
                let semi = pcb[base] & 0x7F;
                db.innerHTML += `
                    <div class="module">
                        <div class="module-header">OSC ${i+1}</div>
                        <div class="val-row"><span class="label">OCT</span><span class="num">${Math.floor(semi/12)-3}</span></div>
                        <div class="val-row"><span class="label">SEMI</span><span class="num">${semi%12}</span></div>
                        <div class="val-row"><span class="label">WAVE</span><span class="num">${pcb[base+5]}</span></div>
                        <div class="val-row"><span class="label">MOD1</span><span class="num">${MODS[pcb[base+2] & 0x0F]}</span></div>
                    </div>
                `;
            }

            // FILTER (Based on PHP: Offset 89, 90, 94)
            db.innerHTML += `
                <div class="module">
                    <div class="module-header">FILTER</div>
                    <div class="val-row"><span class="label">FREQ</span><span class="num">${pcb[89] & 0x3F}</span></div>
                    <div class="val-row"><span class="label">RES</span><span class="num">${pcb[90] & 0x1F}</span></div>
                    <div class="val-row"><span class="label">KBD</span><span class="num">${(pcb[94] >> 1) & 0x3F}</span></div>
                </div>
            `;
        }
    </script>
</body>
</html>
