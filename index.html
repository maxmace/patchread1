<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --accent: #4a90e2; /* Blue */
            --text: #dcdcdc;
            --border: #444;
            --label: #999;
            --esq-gold: #f1c40f;
            --sq80-blue: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        #drop-zone {
            width: 100%;
            height: 80px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .file-info-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 5px 10px;
            background: #222;
            border-radius: 4px;
        }

        .type-icon {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
        }

        .icon-bank { background: #27ae60; color: white; }
        .icon-single { background: #8e44ad; color: white; }

        .bank-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Hide banks if single patch loaded */
        .hidden { display: none !important; }

        .bank-block { background: #222; border: 1px solid var(--border); padding: 10px; }
        .bank-header { font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 8px; font-size: 12px; }
        .patch-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        
        .patch-item {
            font-size: 11px; padding: 6px 2px; background: #2d2d2d; text-align: center; cursor: pointer; border: 1px solid transparent;
        }
        .patch-item.selected { background: var(--accent); color: #fff; }

        .status-area {
            margin-bottom: 25px;
            font-size: 1.2rem;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .label-blue { color: var(--accent); font-weight: bold; }
        .val-yellow { color: var(--esq-gold); font-weight: bold; }

        .synth-type-badge {
            display: inline-block;
            margin-left: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-esq { border: 1px solid var(--esq-gold); color: var(--esq-gold); }
        .badge-sq80 { border: 1px solid var(--sq80-blue); color: var(--sq80-blue); }

        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .module { background: var(--panel); border: 1px solid var(--border); padding: 12px; border-radius: 4px; }
        .module-header { font-size: 10px; font-weight: bold; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #444; }
        .val-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
        .label { color: var(--label); }
        .num { color: #5dade2; font-family: monospace; }
    </style>
</head>
<body>

    <div id="drop-zone">Drop ESQ/SQ-80 System Exclusive files here. Click to load manually.</div>
    <input type="file" id="file-input" style="display: none;">

    <div id="file-info-bar" class="file-info-bar hidden">
        <span id="file-type-icon" class="type-icon"></span>
        <span id="filename-display" style="color: #aaa;"></span>
    </div>

    <div id="bank-container" class="bank-container hidden">
        <div class="bank-block"><div class="bank-header">INT 1</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="status-area" class="status-area hidden">
        <span class="label-blue">PATCH NAME: </span>
        <span id="patch-name-display" class="val-yellow">---</span>
        <span id="synth-type-icon"></span>
    </div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
            dropZone.addEventListener(e, (ev) => { ev.preventDefault(); ev.stopPropagation(); });
        });

        dropZone.addEventListener('drop', (ev) => handleFile(ev.dataTransfer.files[0]));
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            document.getElementById('filename-display').innerText = file.name;
            document.getElementById('file-info-bar').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        }

        function toSigned(val) {
            let out = (val & 0x80) ? -(val ^ 0xFF) - 1 : val;
            return Math.floor(out / 2);
        }

        let patches = [];

        function process(data) {
            let unpacked = [];
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }

            patches = [];
            const pcbSize = 102;
            const totalPatches = Math.floor(unpacked.length / pcbSize);

            // Set file type icon
            const typeIcon = document.getElementById('file-type-icon');
            const bankContainer = document.getElementById('bank-container');
            
            if (totalPatches > 1) {
                typeIcon.innerText = "BANK";
                typeIcon.className = "type-icon icon-bank";
                bankContainer.classList.remove('hidden');
            } else {
                typeIcon.innerText = "SINGLE PATCH";
                typeIcon.className = "type-icon icon-single";
                bankContainer.classList.add('hidden');
            }

            for (let i = 0; i < totalPatches; i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                let name = "";
                for(let n=0; n<6; n++) { name += String.fromCharCode(pcb[n] & 0x7F); }
                patches.push({ name: name.trim() || "UNTITLED", pcb: pcb });
            }

            renderBanks();
            if (patches.length > 0) displayParameters(patches[0]);
        }

        function renderBanks() {
            for (let b = 0; b < 4; b++) {
                const list = document.getElementById(`bank-${b}`);
                list.innerHTML = '';
                for (let p = 0; p < 10; p++) {
                    const idx = (b * 10) + p;
                    if (!patches[idx]) break;
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = patches[idx].name;
                    div.onclick = () => displayParameters(patches[idx]);
                    list.appendChild(div);
                }
            }
        }

        function displayParameters(patch) {
            document.getElementById('status-area').classList.remove('hidden');
            document.getElementById('patch-name-display').innerText = patch.name;
            
            // Detect SQ-80 vs ESQ
            // Logic: SQ-80 waves start above 31, or DCA4 depth is used in certain ways
            let isSQ80 = patch.pcb[88] > 0 || patch.pcb[63] > 31; 
            const typeBadge = document.getElementById('synth-type-icon');
            typeBadge.innerText = isSQ80 ? "SQ-80" : "ESQ";
            typeBadge.className = isSQ80 ? "synth-type-badge badge-sq80" : "synth-type-badge badge-esq";

            const pcb = patch.pcb;
            const db = document.getElementById('dashboard');
            db.innerHTML = '';

            const createModule = (title, params) => {
                let html = `<div class="module"><div class="module-header">${title}</div>`;
                params.forEach(p => html += `<div class="val-row"><span class="label">${p.l}</span><span class="num">${p.v}</span></div>`);
                return html + `</div>`;
            };

            // Layout mapping (5-row structure)
            // Row 1: OSCs
            for(let i=1; i<=3; i++) db.innerHTML += createModule(`OSC ${i}`, [{l:'WAVE',v:pcb[58+(i*10)-2]}]); // Offset simplified for example
            db.innerHTML += `<div></div>`; 

            // Row 2: DCAs
            for(let i=1; i<=3; i++) db.innerHTML += createModule(`DCA ${i}`, [{l:'LVL',v:pcb[64+(i*10)-2]}]);
            db.innerHTML += `<div></div>`;

            // Row 3: LFOs
            for(let i=1; i<=3; i++) db.innerHTML += createModule(`LFO ${i}`, [{l:'FRQ',v:pcb[46+((i-1)*4)]}]);
            db.innerHTML += `<div></div>`;

            // Row 4: ENVs
            for(let i=1; i<=4; i++) db.innerHTML += createModule(`ENV ${i}`, [{l:'L1',v:toSigned(pcb[6+((i-1)*10)])}]);

            // Row 5: Bottom
            db.innerHTML += createModule('FILTER', [{l:'FRQ',v:pcb[89]}]);
            db.innerHTML += createModule('MODES', [{l:'SYNC',v:pcb[96]}]);
            db.innerHTML += createModule('SPLIT/LAYER', [{l:'MODE',v:pcb[98]}]);
            db.innerHTML += createModule('DCA 4', [{l:'AMT',v:pcb[88]}]);
        }
    </script>
</body>
</html>
