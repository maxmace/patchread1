<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #2d2d2d;
            --accent: #4a90e2; 
            --text: #dcdcdc;
            --border: #444;
            --label: #999;
            --esq-gold: #f1c40f;
            --sq80-blue: #3498db;
            --bank-green: #27ae60;
            --single-purple: #8e44ad;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        #drop-zone {
            width: 100%;
            height: 70px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            color: var(--accent);
        }

        /* File Info Bar */
        .file-info-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 8px 12px;
            background: #222;
            border-radius: 4px;
        }

        .label-blue { color: var(--accent); font-weight: bold; }
        
        .type-icon {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            color: white;
        }
        .icon-bank { background: var(--bank-green); }
        .icon-single { background: var(--single-purple); }

        /* Bank Layout */
        .bank-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .bank-block { background: #222; border: 1px solid var(--border); padding: 10px; }
        .bank-header { font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 8px; font-size: 12px; }
        .patch-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .patch-item { font-size: 11px; padding: 6px 2px; background: #2d2d2d; text-align: center; cursor: pointer; border: 1px solid transparent; }
        .patch-item.selected { background: var(--accent); color: #fff; }

        .hidden { display: none !important; }

        /* Status Area */
        .status-area { margin-bottom: 25px; font-size: 1.2rem; border-top: 1px solid #333; padding-top: 15px; }
        .val-yellow { color: var(--esq-gold); font-weight: bold; }

        .synth-type-badge {
            display: inline-block;
            margin-left: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-esq { border: 1px solid var(--esq-gold); color: var(--esq-gold); }
        .badge-sq80 { border: 1px solid var(--sq80-blue); color: var(--sq80-blue); }

        /* Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(12, 1fr); /* 12 units allows easy 3 and 4 splits */
            gap: 15px;
        }

        .module {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 4px;
        }

        /* Responsive spans */
        .span-4 { grid-column: span 4; } /* For 3-column rows */
        .span-3 { grid-column: span 3; } /* For 4-column rows */

        .module-header {
            font-size: 10px;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        /* 2-Row Parameter layout for OSCs */
        .param-row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .param-group { display: flex; align-items: center; gap: 4px; font-size: 12px; }
        .label { color: var(--label); font-size: 10px; text-transform: uppercase; }
        .num { color: #5dade2; font-family: monospace; font-weight: bold; }

    </style>
</head>
<body>

    <div id="drop-zone">Drop ESQ/SQ-80 System Exclusive files here. Click to load manually.</div>
    <input type="file" id="file-input" style="display: none;">

    <div id="file-info-bar" class="file-info-bar hidden">
        <span class="label-blue">FILE NAME: </span>
        <span id="filename-display" style="color: #eee; margin-right: 10px;"></span>
        <span id="file-type-icon" class="type-icon"></span>
    </div>

    <div id="bank-container" class="bank-container hidden">
        <div class="bank-block"><div class="bank-header">INT 1</div><div id="bank-0" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 2</div><div id="bank-1" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 3</div><div id="bank-2" class="patch-list"></div></div>
        <div class="bank-block"><div class="bank-header">INT 4</div><div id="bank-3" class="patch-list"></div></div>
    </div>

    <div id="status-area" class="status-area hidden">
        <span class="label-blue">PATCH NAME: </span>
        <span id="patch-name-display" class="val-yellow">---</span>
        <span id="synth-type-icon"></span>
    </div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const MODS = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL-X", "KBD", "KBD2", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Logic Helpers
        const toSigned = (val) => (val & 0x80) ? -(val ^ 0xFF) - 1 : val;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
            dropZone.addEventListener(e, (ev) => { ev.preventDefault(); ev.stopPropagation(); });
        });

        dropZone.addEventListener('drop', (ev) => handleFile(ev.dataTransfer.files[0]));
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            document.getElementById('filename-display').innerText = file.name;
            document.getElementById('file-info-bar').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (ev) => process(new Uint8Array(ev.target.result));
            reader.readAsArrayBuffer(file);
        }

        let patches = [];

        function process(data) {
            let unpacked = [];
            for (let i = 5; i < data.length - 1; i += 2) {
                unpacked.push(((data[i+1] & 0x0F) << 4) | (data[i] & 0x0F));
            }
            patches = [];
            const pcbSize = 102;
            const totalPatches = Math.floor(unpacked.length / pcbSize);

            const typeIcon = document.getElementById('file-type-icon');
            const bankContainer = document.getElementById('bank-container');
            
            if (totalPatches > 1) {
                typeIcon.innerText = "BANK";
                typeIcon.className = "type-icon icon-bank";
                bankContainer.classList.remove('hidden');
            } else {
                typeIcon.innerText = "SINGLE PATCH";
                typeIcon.className = "type-icon icon-single";
                bankContainer.classList.add('hidden');
            }

            for (let i = 0; i < totalPatches; i++) {
                let pcb = unpacked.slice(i * pcbSize, (i + 1) * pcbSize);
                let name = "";
                for(let n=0; n<6; n++) { name += String.fromCharCode(pcb[n] & 0x7F); }
                patches.push({ name: name.trim() || "UNTITLED", pcb: pcb });
            }

            renderBanks();
            if (patches.length > 0) displayParameters(patches[0]);
        }

        function renderBanks() {
            for (let b = 0; b < 4; b++) {
                const list = document.getElementById(`bank-${b}`);
                list.innerHTML = '';
                for (let p = 0; p < 10; p++) {
                    const idx = (b * 10) + p;
                    if (!patches[idx]) break;
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = patches[idx].name;
                    div.onclick = () => {
                        document.querySelectorAll('.patch-item').forEach(e=>e.classList.remove('selected'));
                        div.classList.add('selected');
                        displayParameters(patches[idx]);
                    }
                    list.appendChild(div);
                }
            }
        }

        function displayParameters(patch) {
            document.getElementById('status-area').classList.remove('hidden');
            document.getElementById('patch-name-display').innerText = patch.name;
            const pcb = patch.pcb;
            
            // SQ-80 Detection Logic
            let isSQ80 = pcb[88] > 0 || pcb[63] > 31; 
            const typeBadge = document.getElementById('synth-type-icon');
            typeBadge.innerText = isSQ80 ? "SQ-80" : "ESQ";
            typeBadge.className = isSQ80 ? "synth-type-badge badge-sq80" : "synth-type-badge badge-esq";

            const db = document.getElementById('dashboard');
            db.innerHTML = '';

            // ROW 1: OSCILLATORS (3 modules, full width)
            for(let i=1; i<=3; i++) {
                let base = 58 + (i-1)*10;
                let semi = pcb[base] & 0x7F;
                db.innerHTML += `
                    <div class="module span-4">
                        <div class="module-header">OSC ${i}</div>
                        <div class="param-row">
                            <div class="param-group"><span class="label">OCT</span><span class="num">${Math.floor(semi/12)-3}</span></div>
                            <div class="param-group"><span class="label">SEMI</span><span class="num">${semi%12}</span></div>
                            <div class="param-group"><span class="label">FINE</span><span class="num">${pcb[base+1]}</span></div>
                            <div class="param-group"><span class="label">WAVE</span><span class="num">${pcb[base+5]}</span></div>
                        </div>
                        <div class="param-row">
                            <div class="param-group"><span class="label">MOD 1</span><span class="num">${MODS[pcb[base+2]&0x0F]} ${toSigned(pcb[base+3])}</span></div>
                            <div class="param-group"><span class="label">MOD 2</span><span class="num">${MODS[pcb[base+2]>>4]} ${toSigned(pcb[base+4])}</span></div>
                        </div>
                    </div>
                `;
            }

            // ROW 2: DCAs (Generic placeholder for now)
            for(let i=1; i<=3; i++) db.innerHTML += `<div class="module span-4"><div class="module-header">DCA ${i}</div></div>`;
            
            // ROW 3: LFOs (Generic placeholder for now)
            for(let i=1; i<=3; i++) db.innerHTML += `<div class="module span-4"><div class="module-header">LFO ${i}</div></div>`;

            // ROW 4: ENVs (4 modules)
            for(let i=1; i<=4; i++) db.innerHTML += `<div class="module span-3"><div class="module-header">ENV ${i}</div></div>`;

            // ROW 5: Bottom (4 modules)
            ['FILTER','MODES','SPLIT/LAYER','DCA 4'].forEach(title => {
                db.innerHTML += `<div class="module span-3"><div class="module-header">${title}</div></div>`;
            });
        }
    </script>
</body>
</html>
