<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SysEx Loader</title>
    <style>
        #drop-zone {
            width: 100%;
            height: 200px;
            border: 3px dashed #4a4a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            cursor: pointer;
            transition: 0.3s;
        }
        #drop-zone.hover { background: #e1f5fe; border-color: #03a9f4; }
        .info { margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>

    <h2>Ensoniq ESQ-1 / SQ-80 File Loader</h2>
    
    <div id="drop-zone">
        Drag & Drop .SYX or .MDX files here (or click to select)
    </div>
    <input type="file" id="file-input" accept=".syx,.mdx" style="display: none;">

    <div id="output" class="info"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const output = document.getElementById('output');

        // Click to open file picker
        dropZone.addEventListener('click', () => fileInput.click());

        // Drag and Drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('hover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            const file = files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const rawData = new Uint8Array(e.target.result);
                analyzeSysEx(rawData, file.name);
            };
            reader.readAsArrayBuffer(file);
        }

        function analyzeSysEx(data, filename) {
            const size = data.length;
            let type = "Unknown";

            // Basic Ensoniq Check: MIDI Start (0xF0), Ensoniq ID (0x0F)
            const isEnsoniq = (data[0] === 0xF0 && data[1] === 0x0F);

            if (!isEnsoniq) {
                output.innerHTML = `⚠️ <strong>Error:</strong> File does not appear to be a valid Ensoniq SysEx message.`;
                return;
            }

            // Simple logic to differentiate based on common Ensoniq sizes
            // ESQ-1 single patches are ~102 bytes; Banks are ~4100+ bytes
            if (size < 500) {
                type = "Single Patch File";
            } else if (size > 3000) {
                type = "Bank File (40 Patches)";
            }

            output.innerHTML = `
                <strong>File Name:</strong> ${filename}<br>
                <strong>Size:</strong> ${size} bytes<br>
                <strong>Detected Type:</strong> ${type}<br>
                <strong>Hex Header:</strong> ${Array.from(data.slice(0, 5)).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ')}...
            `;
            
            console.log("Raw Data:", data);
        }
    </script>
</body>
</html>
