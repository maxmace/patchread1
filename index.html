<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --module: #2a2a2a; --accent: #0078d4; --text: #e0e0e0; --label: #888; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        #drop-zone { width: 100%; height: 80px; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; background: var(--panel); cursor: pointer; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        #status-bar { background: var(--panel); padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; border-bottom: 2px solid #333; }
        .bank-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bank-container { background: #181818; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .patch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .patch-item { background: var(--panel); padding: 8px 4px; border-radius: 3px; cursor: pointer; text-align: center; border: 1px solid #333; font-family: monospace; }
        .patch-item.selected { background: var(--accent); color: white; }
        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; margin-top: 20px; display: none; }
        .module { background: var(--module); border-radius: 6px; border: 1px solid #444; padding: 10px; }
        #debug-log { background: #000; color: #0f0; font-family: monospace; padding: 10px; font-size: 10px; margin-top: 20px; border: 1px solid #333; height: 100px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="drop-zone">DROP SQ80 FILE HERE</div>
    <input type="file" id="file-input" style="display: none;">

    <div id="status-bar"><span id="file-info">Ready</span></div>

    <div id="bank-view" class="bank-wrapper"></div>
    <div id="dashboard" class="dashboard"></div>
    
    <div style="color: #888; font-size: 12px; margin-top: 20px;">RAW DATA DEBUG (FIRST 200 BYTES):</div>
    <div id="debug-log">No data loaded yet.</div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const debugLog = document.getElementById('debug-log');

        // Global for console access
        window.rawSysExData = null;

        dropZone.onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => handleFiles(e.target.files);
        
        window.addEventListener("dragover", e => { e.preventDefault(); dropZone.style.borderColor = "#0078d4"; });
        window.addEventListener("dragleave", e => { e.preventDefault(); dropZone.style.borderColor = "#444"; });
        window.addEventListener("drop", e => { 
            e.preventDefault(); 
            dropZone.style.borderColor = "#444";
            handleFiles(e.dataTransfer.files); 
        });

        function handleFiles(files) {
            const file = files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const arr = new Uint8Array(e.target.result);
                window.rawSysExData = arr; // Force set global
                
                // Show raw bytes in the debug window immediately
                debugLog.innerText = Array.from(arr.slice(0, 210)).join(', ');
                
                processSysEx(arr, file.name);
            };
            reader.readAsArrayBuffer(file);
        }

        function unpackSQ80(data, start) {
            let pcb = new Uint8Array(102);
            // We use the "High Nibble Second" approach
            for (let i = 0; i < 102; i++) {
                let offset = start + (i * 2);
                if (offset + 1 >= data.length) break;
                pcb[i] = (data[offset] & 0x0F) | ((data[offset+1] & 0x0F) << 4);
            }
            return pcb;
        }

        function extractName(pcb) {
            let name = "";
            for(let i=94; i<100; i++) {
                let c = pcb[i] & 0x7F;
                name += (c >= 32 && c <= 126) ? String.fromCharCode(c) : "?";
            }
            return name.trim();
        }

        function processSysEx(data, filename) {
            const bankView = document.getElementById('bank-view');
            bankView.innerHTML = '';
            document.getElementById('dashboard').style.display = 'none';

            let patches = [];
            const isBank = data.length > 500;
            const count = isBank ? 40 : 1;
            const headerSize = 10; // F0 0F 03 00 00 00 00 00 00 00

            for (let i = 0; i < count; i++) {
                const offset = headerSize + (i * 204);
                const pcb = unpackSQ80(data, offset);
                patches.push({ pcb, name: extractName(pcb) });
            }

            document.getElementById('file-info').innerText = `${filename} - Found ${patches.length} patch(es)`;
            
            patches.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'patch-item';
                div.innerText = p.name;
                div.onclick = () => {
                    document.querySelectorAll('.patch-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    showDashboard(p.pcb);
                };
                bankView.appendChild(div);
            });
        }

        function showDashboard(pcb) {
            const db = document.getElementById('dashboard');
            db.style.display = 'grid';
            db.innerHTML = `<div class="module" style="grid-column: span 12;">
                <strong>PATCH NAME DATA:</strong> ${pcb.slice(94,100).join(' - ')}
            </div>`;
        }
    </script>
</body>
</html>
