<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80/ESQ-1 Librarian</title>
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --module: #2a2a2a;
            --accent: #0078d4; --text: #e0e0e0; --label: #888;
            --sq80: #d4a017; --esq1: #27ae60;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        #drop-zone { width: 100%; height: 60px; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; background: var(--panel); cursor: pointer; border-radius: 8px; margin-bottom: 15px; }
        #status-bar { background: var(--panel); padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #333; }
        .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .tag-sq80 { background: var(--sq80); color: #000; }
        .tag-esq1 { background: var(--esq1); color: #fff; }
        .patch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 30px; }
        .patch-item { background: var(--panel); padding: 10px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid #333; font-size: 0.85rem; }
        .patch-item.selected { background: var(--accent); color: white; }
        
        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; display: none; }
        .span-4 { grid-column: span 4; } 
        .span-3 { grid-column: span 3; }
        @media (max-width: 1000px) { .span-4, .span-3 { grid-column: span 12; } }

        .module { background: var(--module); border-radius: 6px; border: 1px solid #444; }
        .module-header { background: #333; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; color: #aaa; border-bottom: 1px solid #444; }
        .param-grid { display: grid; grid-template-columns: 50px repeat(4, 1fr); }
        .cell { border: 1px solid #333; padding: 6px; font-family: monospace; font-size: 0.9rem; }
        .label { color: var(--label); font-size: 0.6rem; display: block; }
        .val { color: #fff; font-weight: bold; }
        .mod-row { background: #222; }
    </style>
</head>
<body>

    <div id="drop-zone">Click or Drop .SYX File</div>
    <input type="file" id="file-input" style="display: none;">

    <div id="status-bar">
        <span id="file-info">No file loaded</span>
        <span id="model-badge"></span>
    </div>

    <div id="patch-list" class="patch-grid"></div>
    <div id="dashboard" class="dashboard"></div>

    <script>
        const MOD_SOURCES = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL2", "KYBD", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];
        const LFO_WAVES = ["TRI", "SAW", "SQR", "NOISE", "RAND"];

        function unpackNibbles(data, start) {
            let pcb = new Uint8Array(102);
            for (let i = 0; i < 102; i++) {
                // SQ-80/ESQ-1 SysEx: Byte 1 is High Nibble (0000xxxx), Byte 2 is Low Nibble (0000yyyy)
                pcb[i] = ((data[start + (i * 2)] & 0x0F) << 4) | (data[start + (i * 2) + 1] & 0x0F);
            }
            return pcb;
        }

        function extractName(pcb) {
            let name = "";
            for(let i=94; i<100; i++) {
                let charCode = pcb[i] & 0x7F; // Masking to 7-bit ASCII
                name += (charCode >= 32 && charCode <= 126) ? String.fromCharCode(charCode) : "?";
            }
            return name.trim();
        }

        function drawDashboard(pcb, name) {
            console.log("Current PCB Data for " + name + ":", pcb);
            const db = document.getElementById('dashboard');
            db.style.display = 'grid';
            db.innerHTML = '';

            // Row 1: OSC
            db.innerHTML += createOscModule("OSCILLATOR 1", pcb, 0, 12, "span-4");
            db.innerHTML += createOscModule("OSCILLATOR 2", pcb, 5, 16, "span-4");
            db.innerHTML += createOscModule("OSCILLATOR 3", pcb, 10, 20, "span-4");

            // Row 2: DCA 1-3
            db.innerHTML += createDCAModule("DCA 1", pcb, 14, "span-4");
            db.innerHTML += createDCAModule("DCA 2", pcb, 18, "span-4");
            db.innerHTML += createDCAModule("DCA 3", pcb, 22, "span-4");

            // Row 3: LFOs
            db.innerHTML += createLFOModule("LFO 1", pcb, 28, "span-4");
            db.innerHTML += createLFOModule("LFO 2", pcb, 32, "span-4");
            db.innerHTML += createLFOModule("LFO 3", pcb, 36, "span-4");

            // Row 4: ENVs
            db.innerHTML += createEnvModule("ENVELOPE 1", pcb, 42, "span-3");
            db.innerHTML += createEnvModule("ENVELOPE 2", pcb, 54, "span-3");
            db.innerHTML += createEnvModule("ENVELOPE 3", pcb, 66, "span-3");
            db.innerHTML += createEnvModule("ENVELOPE 4", pcb, 78, "span-3");

            // Row 5: Misc
            db.innerHTML += createFilterModule(pcb, "span-3");
            db.innerHTML += createModesModule(pcb, "span-3");
            db.innerHTML += createSplitModule(pcb, "span-3");
            db.innerHTML += createDCAModule("DCA 4 (PAN)", pcb, 90, "span-3");
        }

        function createOscModule(title, pcb, b, m, span) {
            return `<div class="module ${span}"><div class="module-header">${title}</div>
                <div class="param-grid">
                    <div class="cell">WAVE</div><div class="cell" style="grid-column:span 4"><span class="val">${pcb[b]}</span></div>
                    <div class="cell">TUNE</div><div class="cell"><span class="label">OCT</span><span class="val">${((pcb[b+1] >> 4) & 0x0F) - 3}</span></div>
                    <div class="cell"><span class="label">SEMI</span><span class="val">${pcb[b+1] & 0x0F}</span></div>
                    <div class="cell" style="grid-column:span 2"><span class="label">FINE</span><span class="val">${pcb[b+2]}</span></div>
                    <div class="cell mod-row">MODS</div><div class="cell mod-row" style="grid-column:span 2"><span class="label">${MOD_SOURCES[pcb[m]]}</span><span class="val">${(pcb[m+1] << 24 >> 24)}</span></div>
                    <div class="cell mod-row" style="grid-column:span 2"><span class="label">${MOD_SOURCES[pcb[m+2]]}</span><span class="val">${(pcb[m+3] << 24 >> 24)}</span></div>
                </div></div>`;
        }

        function createLFOModule(title, pcb, b, span) {
            const reset = (pcb[b+2] & 0x80) ? "ON" : "OFF";
            const humanWave = LFO_WAVES[pcb[b+2] & 0x07] || pcb[b+2];
            return `<div class="module ${span}"><div class="module-header">${title}</div>
                <div class="param-grid">
                    <div class="cell">MAIN</div>
                    <div class="cell"><span class="label">FREQ</span><span class="val">${pcb[b]}</span></div>
                    <div class="cell"><span class="label">DLY</span><span class="val">${pcb[b+3]}</span></div>
                    <div class="cell"><span class="label">WAVE</span><span class="val">${humanWave}</span></div>
                    <div class="cell"><span class="label">RST</span><span class="val">${reset}</span></div>
                    <div class="cell mod-row">MOD</div>
                    <div class="cell mod-row" style="grid-column:span 4"><span class="label">LFO MOD</span><span class="val">${pcb[b+1]}</span></div>
                </div></div>`;
        }

        function createDCAModule(title, pcb, b, span) {
            return `<div class="module ${span}"><div class="module-header">${title}</div>
                <div class="param-grid">
                    <div class="cell">LVL</div><div class="cell" style="grid-column:span 4"><span class="val">${pcb[b]}</span></div>
                    <div class="cell mod-row">MOD</div>
                    <div class="cell mod-row" style="grid-column:span 2"><span class="label">SRC</span><span class="val">${MOD_SOURCES[pcb[b+1]]}</span></div>
                    <div class="cell mod-row" style="grid-column:span 2"><span class="label">AMT</span><span class="val">${pcb[b+2]}</span></div>
                </div></div>`;
        }

        function createEnvModule(title, pcb, b, span) {
            return `<div class="module ${span}"><div class="module-header">${title}</div>
                <div class="param-grid">
                    <div class="cell">LVL</div><div class="cell"><span class="label">L1</span><span class="val">${pcb[b]}</span></div>
                    <div class="cell"><span class="label">L2</span><span class="val">${pcb[b+2]}</span></div><div class="cell"><span class="label">L3</span><span class="val">${pcb[b+4]}</span></div><div class="cell"><span class="label">LV</span><span class="val">${pcb[b+10]}</span></div>
                    <div class="cell mod-row">TIME</div><div class="cell mod-row"><span class="label">T1</span><span class="val">${pcb[b+1]}</span></div>
                    <div class="cell mod-row"><span class="label">T2</span><span class="val">${pcb[b+3]}</span></div><div class="cell mod-row"><span class="label">T3</span><span class="val">${pcb[b+5]}</span></div><div class="cell mod-row"><span class="label">T4</span><span class="val">${pcb[b+6]}</span></div>
                </div></div>`;
        }

        function createFilterModule(pcb, span) {
            return `<div class="module ${span}"><div class="module-header">FILTER</div>
                <div class="param-grid">
                    <div class="cell">MAIN</div><div class="cell"><span class="label">FREQ</span><span class="val">${pcb[20]}</span></div>
                    <div class="cell"><span class="label">RES</span><span class="val">${pcb[21]}</span></div><div class="cell"><span class="label">KYBD</span><span class="val">${pcb[23]}</span></div><div class="cell"></div>
                    <div class="cell mod-row">MODS</div><div class="cell mod-row" style="grid-column:span 2"><span class="label">${MOD_SOURCES[pcb[24]]}</span><span class="val">${pcb[25]}</span></div>
                    <div class="cell mod-row" style="grid-column:span 2"><span class="label">${MOD_SOURCES[pcb[26]]}</span><span class="val">${pcb[27]}</span></div>
                </div></div>`;
        }

        function createModesModule(pcb, span) {
            const sync = (pcb[40] & 0x01) ? "ON" : "OFF";
            const am = (pcb[40] & 0x02) ? "ON" : "OFF";
            const mono = (pcb[40] & 0x04) ? "ON" : "OFF";
            const glide = pcb[41];
            return `<div class="module ${span}"><div class="module-header">MODES</div>
                <div class="param-grid">
                    <div class="cell">SYNC</div><div class="cell"><span class="val">${sync}</span></div>
                    <div class="cell">AM</div><div class="cell"><span class="val">${am}</span></div>
                    <div class="cell">MONO</div><div class="cell"><span class="val">${mono}</span></div>
                    <div class="cell">GLIDE</div><div class="cell"><span class="val">${glide}</span></div>
                </div></div>`;
        }

        function createSplitModule(pcb, span) {
            return `<div class="module ${span}"><div class="module-header">SPLIT / LAYER</div>
                <div class="param-grid">
                    <div class="cell">PROG</div><div class="cell" style="grid-column:span 4"><span class="val">${pcb[92]}</span></div>
                    <div class="cell">KEY</div><div class="cell" style="grid-column:span 4"><span class="val">${pcb[93]}</span></div>
                </div></div>`;
        }

        // --- File Handling Logic ---
        document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = new Uint8Array(ev.target.result);
                const pList = document.getElementById('patch-list');
                pList.innerHTML = '';
                // Assume 40 patch bank for now
                for (let i = 0; i < 40; i++) {
                    const pcb = unpackNibbles(data, 10 + (i * 204));
                    const name = extractName(pcb);
                    const div = document.createElement('div');
                    div.className = 'patch-item';
                    div.innerText = name;
                    div.onclick = () => {
                        document.querySelectorAll('.patch-item').forEach(e=>e.classList.remove('selected'));
                        div.classList.add('selected');
                        drawDashboard(pcb, name);
                    };
                    pList.appendChild(div);
                }
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };
    </script>
</body>
</html>
