<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ensoniq SQ-80 Librarian</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --module: #2a2a2a; --accent: #0078d4; --text: #e0e0e0; --label: #888; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        #drop-zone { width: 100%; height: 60px; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; background: var(--panel); cursor: pointer; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: var(--accent); }
        #status-bar { background: var(--panel); padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; border-bottom: 2px solid #333; display: flex; justify-content: space-between; }
        .bank-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bank-container { background: #181818; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .bank-header { font-weight: bold; color: var(--accent); margin-bottom: 10px; font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .patch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .patch-item { background: var(--panel); padding: 10px 4px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid #333; font-family: monospace; font-size: 0.85rem; }
        .patch-item.selected { background: var(--accent); color: white; border-color: #fff; }
        .dashboard { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin-top: 25px; display: none; }
        .module { background: var(--module); border-radius: 6px; border: 1px solid #444; overflow: hidden; }
        .module-header { background: #333; padding: 6px 12px; font-size: 0.7rem; font-weight: bold; color: #999; text-transform: uppercase; }
        .param-grid { display: grid; grid-template-columns: 55px repeat(4, 1fr); }
        .cell { border: 1px solid #333; padding: 8px; font-family: monospace; }
        .label { color: var(--label); font-size: 0.55rem; display: block; }
        .val { color: #fff; font-weight: bold; }
        .mod-row { background: rgba(0,0,0,0.25); }
        .span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
    </style>
</head>
<body>

    <div id="drop-zone">DRAG & DROP ENSONIQ .SYX</div>
    <input type="file" id="file-input" style="display: none;">
    <div id="status-bar"><span id="file-info">Ready</span><span id="patch-count-badge"></span></div>
    <div id="bank-view" class="bank-wrapper"></div>
    <div id="dashboard" class="dashboard"></div>

    <script>
        const MOD_SOURCES = ["LFO1", "LFO2", "LFO3", "ENV1", "ENV2", "ENV3", "ENV4", "VEL", "VEL2", "KYBD", "WHEEL", "PEDAL", "XCTRL", "PRESS", "OFF"];

        document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => handleFiles(e.target.files);
        window.addEventListener("dragover", e => e.preventDefault());
        window.addEventListener("drop", e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

        function handleFiles(files) {
            const file = files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => processSysEx(new Uint8Array(e.target.result), file.name);
            reader.readAsArrayBuffer(file);
        }

        /**
         * Reconstructs 8-bit bytes from a 7-bit MIDI stream.
         * This handles the "all-data" packing used in SQ-80 dumps.
         */
        function bitStreamUnpack(data, start, targetLength) {
            let pcb = new Uint8Array(targetLength);
            let bitBuffer = 0;
            let bitsInOverflow = 0;
            let pcbIdx = 0;
            let midiIdx = start;

            while (pcbIdx < targetLength && midiIdx < data.length) {
                // Add 7 bits from MIDI byte to buffer
                bitBuffer |= (data[midiIdx] & 0x7F) << bitsInOverflow;
                bitsInOverflow += 7;
                midiIdx++;

                // If we have at least 8 bits, extract one byte
                if (bitsInOverflow >= 8) {
                    pcb[pcbIdx++] = bitBuffer & 0xFF;
                    bitBuffer >>= 8;
                    bitsInOverflow -= 8;
                }
            }
            return pcb;
        }

        function extractName(pcb) {
            let name = "";
            for(let i=94; i<100; i++) {
                let c = pcb[i] & 0x7F;
                // Hardware only supports uppercase and symbols (32-95)
                if (c >= 32 && c <= 126) name += String.fromCharCode(c);
                else name += " ";
            }
            return name.trim().toUpperCase();
        }

        function processSysEx(data, filename) {
            const bankView = document.getElementById('bank-view');
            bankView.innerHTML = '';
            document.getElementById('dashboard').style.display = 'none';

            let patches = [];
            const isBank = data.length > 500;
            const count = isBank ? 40 : 1;
            
            // Header is 10 bytes: F0 0F 03 00 00 00 00 00 00 00
            // Each patch record is 102 bytes internal, which takes ~117 MIDI bytes packed
            const midiStride = Math.ceil((102 * 8) / 7);

            for (let i = 0; i < count; i++) {
                const start = 10 + (i * midiStride);
                const pcb = bitStreamUnpack(data, start, 102);
                patches.push({ pcb, name: extractName(pcb) });
            }

            document.getElementById('file-info').innerText = filename;
            renderView(patches, isBank);
        }

        function renderView(patches, isBank) {
            const bankView = document.getElementById('bank-view');
            const sections = isBank ? 4 : 1;
            for (let b = 0; b < sections; b++) {
                const container = document.createElement('div');
                container.className = 'bank-container';
                container.innerHTML = `<div class="bank-header">${isBank ? 'INT ' + (b+1) : 'SINGLE'}</div>`;
                const grid = document.createElement('div');
                grid.className = 'patch-grid';
                for (let p = 0; p < (isBank ? 10 : 1); p++) {
                    const idx = (b * 10) + p;
                    if (patches[idx]) grid.appendChild(createPatchElement(patches[idx]));
                }
                container.appendChild(grid);
                bankView.appendChild(container);
            }
            if (!isBank && bankView.querySelector('.patch-item')) {
                bankView.querySelector('.patch-item').click();
            }
        }

        function createPatchElement(patch) {
            const div = document.createElement('div');
            div.className = 'patch-item';
            div.innerText = patch.name || "UNTITLED";
            div.onclick = () => {
                document.querySelectorAll('.patch-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                drawDashboard(patch.pcb);
            };
            return div;
        }

        function drawDashboard(pcb) {
            const db = document.getElementById('dashboard');
            db.style.display = 'grid';
            db.innerHTML = '';
            
            // Re-render the full PCB structure
            db.innerHTML += createOscModule("OSC 1", pcb, 0, 12);
            db.innerHTML += createOscModule("OSC 2", pcb, 5, 16);
            db.innerHTML += createOscModule("OSC 3", pcb, 10, 20);
            db.innerHTML += createDCAModule("DCA 1", pcb, 14);
            db.innerHTML += createDCAModule("DCA 2", pcb, 18);
            db.innerHTML += createDCAModule("DCA 3", pcb, 22);
            db.innerHTML += createEnvModule("ENV 1", pcb, 42);
            db.innerHTML += createEnvModule("ENV 2", pcb, 54);
            db.innerHTML += createEnvModule("ENV 3", pcb, 66);
            db.innerHTML += createEnvModule("ENV 4", pcb, 78);
            db.innerHTML += createFilterModule(pcb);
            db.innerHTML += createDCAModule("DCA 4 (PAN)", pcb, 90);
        }

        function createOscModule(title, pcb, b, m) {
            return `<div class="module span-4"><div class="module-header">${title}</div><div class="param-grid">
                <div class="cell"><span class="label">WAVE</span><span class="val">${pcb[b]}</span></div>
                <div class="cell"><span class="label">OCT</span><span class="val">${(pcb[b+1] >> 4) - 3}</span></div>
                <div class="cell"><span class="label">SEMI</span><span class="val">${pcb[b+1] & 0x0F}</span></div>
                <div class="cell" style="grid-column:span 2"><span class="label">FINE</span><span class="val">${pcb[b+2]}</span></div>
                <div class="cell mod-row" style="grid-column:span 5"><span class="label">MOD</span><span class="val">${MOD_SOURCES[pcb[m]]} (${(pcb[m+1]<<24>>24)})</span></div>
            </div></div>`;
        }

        function createDCAModule(title, pcb, b) {
            return `<div class="module span-4"><div class="module-header">${title}</div><div class="param-grid">
                <div class="cell">LVL</div><div class="cell" style="grid-column:span 4"><span class="val">${pcb[b]}</span></div>
                <div class="cell mod-row" style="grid-column:span 5"><span class="label">MOD</span><span class="val">${MOD_SOURCES[pcb[b+1]]} (${(pcb[b+2]<<24>>24)})</span></div>
            </div></div>`;
        }

        function createEnvModule(title, pcb, b) {
            return `<div class="module span-3"><div class="module-header">${title}</div><div class="param-grid">
                <div class="cell"><span class="label">L1</span><span class="val">${pcb[b]}</span></div>
                <div class="cell"><span class="label">L2</span><span class="val">${pcb[b+2]}</span></div>
                <div class="cell"><span class="label">L3</span><span class="val">${pcb[b+4]}</span></div>
                <div class="cell"><span class="label">T1</span><span class="val">${pcb[b+1]}</span></div>
            </div></div>`;
        }

        function createFilterModule(pcb) {
            return `<div class="module span-4"><div class="module-header">FILTER</div><div class="param-grid">
                <div class="cell"><span class="label">FREQ</span><span class="val">${pcb[20]}</span></div>
                <div class="cell"><span class="label">RES</span><span class="val">${pcb[21]}</span></div>
                <div class="cell mod-row" style="grid-column:span 5"><span class="label">MOD</span><span class="val">${MOD_SOURCES[pcb[24]]} (${(pcb[25]<<24>>24)})</span></div>
            </div></div>`;
        }
    </script>
</body>
</html>
